<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implant Parts Selector</title>
<style>
  :root{
    --navy:#00205B;
    --navy-deep:#001438;
    --green:#78BE21;
    --green-deep:#5C9418;
    --paper:#F2F4F7;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6572;
    --line:#E1E5EB;
    --amber:#C4740A;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, select{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  input[type=number]{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
    font-size:16px; /* iOS Safari auto-zooms on focus if an input's font is under 16px */
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr 340px;
    min-height:100vh;
    min-height:100dvh;
  }
  /* ---- Header ---- */
  .topbar{
    grid-column:1/-1;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--green);
  }
  .topbar .brand{display:flex; flex-direction:column; gap:2px;}
  .topbar .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--green);
    font-weight:700;
  }
  .topbar .brand h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .topbar .meta{font-size:11px; color:#B9C3DD; text-align:right; line-height:1.5;}
  .topbar .homebtn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; flex:0 0 auto;
    transition:background .15s ease, transform .12s ease;
  }
  .topbar .homebtn:hover{background:rgba(255,255,255,.16);}
  .topbar .homebtn:active{transform:scale(.92);}

  /* ---- Navigation fade transition ---- */
  .app.nav-fade .content, .app.nav-fade .sidebar, .app.nav-fade #homeView{
    opacity:0; transition:opacity .14s ease;
  }
  .content, .sidebar, #homeView{opacity:1; transition:opacity .18s ease;}

  /* ---- Button press feedback (general) ---- */
  button:active, .card:active{transform:scale(.97);}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}

  /* ---- Home screen ---- */
  .app.home-mode{grid-template-columns:1fr;}
  .app.home-mode .systembar, .app.home-mode .sidebar, .app.home-mode .orderpanel, .app.home-mode .content{display:none;}
  #homeView{display:none;}
  .app.home-mode #homeView{grid-column:1/-1; display:flex; justify-content:center; padding:40px 20px 60px; background:#EDEEF0; min-height:calc(100vh - 76px);}
  .home-card-outer{max-width:640px; width:100%; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.12); border:1px solid #d5d8dd; height:fit-content;}
  .home-hero{background:var(--navy); display:flex; align-items:center; gap:28px; padding:32px 36px; opacity:0; animation:homeFadeDown .5s ease-out forwards;}
  .home-hero .art{flex:0 0 auto; width:130px; height:130px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:var(--green); box-shadow:0 8px 24px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12);}
  .home-hero .art svg{width:62%; height:62%; display:block;}
  .home-hero .txt .eyebrow{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); font-weight:700; margin:0 0 8px;}
  .home-hero .txt h2{margin:0; font-size:26px; color:#fff; font-weight:700; letter-spacing:-.01em; line-height:1.2;}
  .home-btn-row{padding:26px 36px 34px; display:flex; flex-direction:column; gap:14px;}
  .home-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left; width:100%;
    font-family:inherit; opacity:0; animation:homeFadeUp .5s ease-out forwards;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .home-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,32,91,.14); border-color:#c9d6ea;}
  .home-card:nth-child(1){animation-delay:.16s;}
  .home-card:nth-child(2){animation-delay:.26s;}
  .home-card:nth-child(3){animation-delay:.36s;}
  .home-card .hc-icon{
    width:46px; height:46px; border-radius:10px; background:#EAF4DC; color:#4F8A16;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:background .18s ease, transform .18s ease;
  }
  .home-card:hover .hc-icon{background:#DCEFC4; transform:scale(1.06);}
  .home-card .hc-icon svg{width:24px; height:24px;}
  .home-card .hc-txt h3{margin:0 0 3px; font-size:15px; color:var(--ink); font-weight:700;}
  .home-card .hc-arrow{margin-left:auto; color:#9AA3AF; font-size:18px; transition:transform .18s ease;}
  .home-card:hover .hc-arrow{transform:translateX(3px); color:var(--green-deep);}
  @keyframes homeFadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes homeFadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (max-width:640px){
    .home-hero{flex-direction:column; text-align:center; padding:28px 24px;}
    .home-hero .art{width:110px; height:110px;}
  }

  /* ---- Odontogram (tooth chart) ---- */
  .odo-wrap{padding:4px 0 8px;}
  .odo-legend{display:flex; gap:16px; margin-bottom:14px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .odo-legend span{display:inline-flex; align-items:center; gap:5px;}
  .odo-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .odo-arch{display:flex; justify-content:center; gap:4px; margin-bottom:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px;}
  .odo-arch.lower{margin-bottom:0; margin-top:10px;}
  .odo-tooth{
    width:28px; height:36px; border-radius:6px 6px 9px 9px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .1s ease, background .12s ease, border-color .12s ease, color .12s ease;
    flex:0 0 auto;
  }
  .odo-arch.upper .odo-tooth{align-self:flex-end;}
  .odo-arch.lower .odo-tooth{align-self:flex-start; border-radius:9px 9px 6px 6px;}
  .odo-tooth:hover{border-color:#9AA3AF;}
  .odo-tooth:active{transform:scale(.92);}
  .odo-tooth.implant{background:var(--green); border-color:var(--green-deep); color:#fff;}
  .odo-tooth.pontic{background:#F3D48A; border-color:#C99A2E; color:#5A430E;}
  .odo-arch-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); text-align:center; margin:2px 0;}
  .odo-summary{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:14px; min-height:18px;}
  .odo-summary b{color:var(--ink);}
  @media (max-width:480px){
    .modal-overlay{padding:8px;}
    .modal-box.modal-grouped{padding:10px;}
    .odo-tooth{width:17px; height:27px; font-size:8.5px; border-radius:3px 3px 6px 6px;}
    .odo-arch.lower .odo-tooth{border-radius:6px 6px 3px 3px;}
    .odo-arch{gap:1px;}
  }

  /* ---- Treatment plan summary (order panel) ---- */
  .treatment-plan-card{
    background:#EAF4DC; border:1px solid #C9E0A5; border-radius:10px; padding:12px 14px; margin-bottom:14px;
    font-size:12px; color:#3E6310; line-height:1.5;
  }
  .treatment-plan-card .tp-title{font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;}
  .treatment-plan-card .tp-clear{background:none; border:none; color:#3E6310; text-decoration:underline; font-size:11px; cursor:pointer; padding:0;}
  .order-row .tooth-tag{
    display:inline-block; background:#EAF4DC; color:#4F8A16; border-radius:5px; padding:1px 6px;
    font-size:10px; font-weight:700; margin-left:6px; font-family:var(--sans);
  }

  /* ---- System switcher ---- */
  .systembar{
    grid-column:1/-1;
    background:var(--navy-deep);
    display:flex;
    gap:8px;
    padding:10px 28px;
    overflow-x:auto;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .systembar button.sysbtn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    background:rgba(255,255,255,.05);
    border:1.5px solid rgba(255,255,255,.1);
    color:#B9C3DD;
    border-radius:9px;
    padding:8px 16px;
    cursor:pointer;
    font-family:var(--sans);
    transition:all .12s;
    white-space:nowrap;
  }
  .systembar button.sysbtn .sysname{font-size:12.5px; font-weight:700;}
  .systembar button.sysbtn:hover{border-color:var(--green); color:#fff;}
  .systembar button.sysbtn.active{
    background:var(--green);
    border-color:var(--green);
    color:#0E2B00;
  }
  .systembar button.sysbtn.active .sysname{color:#0E2B00;}
  .systembar button.favtab .sysname{color:var(--green);}
  .systembar button.favtab:hover{border-color:var(--green);}
  .systembar button.favtab:hover .sysname{color:#fff;}
  .systembar button.favtab.active{
    background:var(--green);
    border-color:var(--green);
  }
  .systembar button.favtab.active .sysname{color:#0E2B00;}
  .systembar button.first-system-tab{
    margin-left:10px;
    padding-left:18px;
    border-left:1.5px solid rgba(255,255,255,.15);
  }

  /* ---- Sidebar (categories) ---- */
  .sidebar{
    background:var(--navy);
    padding:18px 0;
    overflow-y:auto;
  }
  .sidebar .sidebar-section{
    padding:14px 18px 6px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--green);
    opacity:.85;
  }
  .sidebar .sidebar-section:not(:first-child){
    margin-top:6px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .sidebar button.catbtn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#C4CEE6;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .12s, color .12s;
  }
  .sidebar button.catbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
  .sidebar button.catbtn.active{
    background:rgba(120,190,33,.14);
    color:#fff;
    border-left-color:var(--green);
  }

  /* ---- Main content ---- */
  .content{
    padding:26px 30px 60px;
    overflow-y:auto;
  }
  .content h2{
    margin:0 0 4px;
    font-size:22px;
    color:var(--navy);
    letter-spacing:-.01em;
  }
  .content .subtitle{
    margin:0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .searchwrap{margin-bottom:20px;}
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13px;
    font-family:var(--sans);
    background:#fff;
  }
  .searchwrap input:focus{outline:2px solid var(--green); border-color:var(--green);}

  .group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .group-head{
    padding:11px 16px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:.01em;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .group-head .headleft{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .group-source{
    padding:4px 16px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    font-size:10.5px;
    color:#6B7280;
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
  }
  .group-source .unverified{
    color:#7A4A0E;
    font-weight:700;
  }
  .group-head .headright{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .group-head .material{
    font-size:10px;
    font-weight:700;
    color:var(--green-deep);
    background:#EEF7E1;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .group-body{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 14px;
  }
  .itembtn-wrap{
    position:relative;
    min-width:150px;
  }
  .itembtn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    width:100%;
    min-width:150px;
    padding:9px 12px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-family:var(--sans);
    text-align:left;
    transition:border-color .12s, background .12s, transform .06s;
  }
  .itembtn:hover{border-color:var(--navy); transform:translateY(-1px);}
  .itembtn .desc{font-size:12px; font-weight:600; color:var(--ink);}
  .itembtn .ref{font-size:10.5px; font-family:var(--mono); color:var(--ink-soft);}
  .itembtn.selected{
    background:var(--green);
    border-color:var(--green-deep);
  }
  .itembtn.selected .desc{color:#0E2B00;}
  .itembtn.selected .ref{color:#274600;}
  .itembtn .qtytag{
    align-self:flex-end;
    font-size:10px;
    font-weight:700;
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    padding:1px 7px;
    margin-top:2px;
  }
  .fav-bucket{margin-bottom:22px;}
  .fav-bucket-head{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    padding-bottom:6px;
    margin-bottom:10px;
    border-bottom:2px solid var(--green);
  }
  .fav-system-head{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin:12px 0 6px;
  }
  .sys-filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:2px 0 16px;
    flex-wrap:wrap;
  }
  .sys-filter-row label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .sys-filter-row select{
    padding:8px 12px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy);
    font-size:13px;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    min-width:200px;
  }
  .sys-filter-row select:focus{outline:2px solid var(--green); border-color:var(--green);}
  .allonx-wizard-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:14px 18px;
    margin-bottom:14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    font-family:var(--sans);
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,32,91,.25);
    transition:transform .1s, box-shadow .1s;
  }
  .allonx-wizard-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 16px rgba(0,32,91,.32);
    background:linear-gradient(135deg,var(--navy) 0%,var(--green-deep) 140%);
  }
  .mismatch-banner{
    background:#FDF2E9;
    border:1.5px solid #E8A23D;
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 12px;
    font-size:11.5px;
    color:#7A4A0E;
    line-height:1.5;
  }
  .mismatch-banner .mismatch-title{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:4px;
  }
  .mismatch-banner ul{margin:0; padding-left:18px;}
  .pending-badge{
    display:inline-block;
    background:#FDF2E9;
    border:1px solid #E8A23D;
    color:#7A4A0E;
    border-radius:5px;
    padding:2px 7px;
    font-size:10px;
    font-weight:700;
    margin-left:8px;
    white-space:nowrap;
  }
  /* Small "i" info badge for a per-group heads-up (e.g. a length or
     sourcing caveat) that doesn't rise to the level of a regulatory
     pending-badge. Hover/focus reveals the detail via native tooltip
     instead of the caveat living permanently in the label text. */
  .note-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#EAF1FB;
    border:1px solid #B7CCEC;
    color:#2C5AA0;
    font-size:10px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    flex:0 0 auto;
  }
  /* Same "i" treatment, sized for the dark topbar next to pageMeta. */
  .meta-note{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    margin-left:6px;
    flex:0 0 auto;
    vertical-align:middle;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,20,56,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    max-width:400px;
    width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    position:relative;
  }
  .modal-exit-x{
    position:absolute;
    top:12px;
    right:12px;
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-exit-x:hover{background:#F1F2F4; color:var(--ink);}
  .modal-box h3{
    margin:0 0 8px;
    color:var(--navy);
    font-size:16px;
    font-weight:700;
  }
  .modal-box p{
    margin:0 0 16px;
    color:var(--ink);
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .modal-box input[type=number]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:16px;
    margin-bottom:18px;
    font-family:var(--sans);
  }
  .modal-box input[type=number]:focus{outline:2px solid var(--green); border-color:var(--green);}
  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .modal-actions button{
    padding:11px 20px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    font-family:var(--sans);
  }
  .modal-btn-cancel{background:#EEF0F3; color:var(--ink);}
  .modal-btn-back{background:#fff; border:1.5px solid var(--line); color:var(--navy); margin-right:auto;}
  .modal-btn-back:hover{border-color:var(--navy);}
  .modal-btn-cancel:hover{background:#E2E5EA;}
  .modal-btn-ok{background:var(--green); color:#0E2B00;}
  .modal-btn-ok:hover{background:var(--green-deep); color:#fff;}
  .modal-box.modal-wide{max-width:480px;}
  .modal-options{

<script>

function sectionOf(sys, cat){ return sys.surgical.has(cat) ? "SURGICAL" : "PROSTHETIC / RESTORATIVE"; }

/* ---------- State ---------- */
let activeSystemId = "blc";
let activeCategory = SYSTEMS[activeSystemId].order[0];
let viewMode = "home";  // "home" | "category" | "favorites" — Home is the default landing screen
let activeFavoritesCategory = FAVORITES_PRESET_CATEGORIES[0];
let activeFavoritesSystem = null; // null = all systems, or a systemId string — filters the Favorites tab

/* Clears activeFavoritesSystem if it isn't valid for whatever category is
   now active — e.g. NobelReplace CC was selected on the Implants tab, then
   the person switches to All-on-X Components, where only BLX/NobelActive/
   Neodent GM are offered. Without this, the stale selection would keep
   showing that system's All-on-X items instead of the restricted set. */
function resetFavoritesSystemIfInvalidForCategory(){
  if(!activeFavoritesSystem) return;
  const allowed = activeFavoritesCategory === "All-on-X Components"
    ? FAVORITES_ALLONX_SYSTEM_IDS
    : SYSTEM_IDS.filter(sid => sid !== "blx"); // blx only exists in this preset for All-on-X
  if(!allowed.includes(activeFavoritesSystem)) activeFavoritesSystem = null;
}
let selected = {};   // key `${systemId}::${ref}` -> {name, group, category, qty, system, ref}

/* ---------- System switcher ---------- */
function buildSystemBar(){
  const bar = document.getElementById('systembar');
  bar.innerHTML = '';

  const geiBtn = document.createElement('button');
  geiBtn.className = 'sysbtn favtab' + (viewMode==='favorites' ? ' active':'');
  geiBtn.innerHTML = `<span class="sysname">⭐ Favorites</span>`;
  geiBtn.onclick = ()=>{
    navigateWithFade(()=>{
      viewMode = 'favorites';
      activeFavoritesCategory = FAVORITES_PRESET_CATEGORIES[0];
      resetFavoritesSystemIfInvalidForCategory();
      document.getElementById('searchBox').value = '';
      render();
    });
  };
  bar.appendChild(geiBtn);

  SYSTEM_IDS.forEach((id,idx)=>{
    const sys = SYSTEMS[id];
    const btn = document.createElement('button');
    btn.className = 'sysbtn' + (idx===0 ? ' first-system-tab' : '') + (id===activeSystemId && viewMode==='category' ? ' active':'');
    btn.innerHTML = `<span class="sysname">${sys.name}</span>`;
    btn.onclick = ()=>{
      navigateWithFade(()=>{
        activeSystemId = id;
        activeCategory = SYSTEMS[id].order[0];
        viewMode = "category";
        document.getElementById('searchBox').value = '';
        render();
      });
    };
    bar.appendChild(btn);
  });

  const metaEl = document.getElementById('pageMeta');
  metaEl.innerHTML = '';
  if(viewMode!=='favorites'){
    const sys = SYSTEMS[activeSystemId];
    metaEl.appendChild(document.createTextNode(sys.fullMeta));
    if(sys.caveat){
      const nb = document.createElement('span');
      nb.className = 'meta-note';
      nb.textContent = 'i';
      nb.title = sys.caveat;
      metaEl.appendChild(nb);
    }
  }
}

/* ---------- Build sidebar: system categories, or the Favorites preset ---------- */
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  if(viewMode==='favorites'){
    FAVORITES_PRESET_CATEGORIES.forEach(pc=>{
      const btn = document.createElement('button');
      btn.className = 'catbtn' + (pc===activeFavoritesCategory ? ' active':'');
      btn.innerHTML = `<span>${pc}</span>`;
      btn.onclick = ()=>{ activeFavoritesCategory = pc; resetFavoritesSystemIfInvalidForCategory(); document.getElementById('searchBox').value=''; render(); };
      sb.appendChild(btn);
    });
    return;
  }

  const sys = SYSTEMS[activeSystemId];
  let lastSection = null;
  sys.order.forEach(cat=>{
    const section = sectionOf(sys, cat);
    if(section !== lastSection){
      const div = document.createElement('div');
      div.className = 'sidebar-section';
      div.textContent = section;
      sb.appendChild(div);
      lastSection = section;
    }
    const btn = document.createElement('button');
    btn.className = 'catbtn' + (cat===activeCategory ? ' active':'');
    btn.innerHTML = `<span>${cat}</span>`;
    btn.onclick = ()=>{ activeCategory = cat; viewMode = 'category'; document.getElementById('searchBox').value=''; render(); };
    sb.appendChild(btn);
  });
}

/* Renders one item as an add-to-order card. */
function renderItemCard(container, systemId, name, ref, groupLabel, category){
  const key = systemId+'::'+ref;
  const wrap = document.createElement('div');
  wrap.className = 'itembtn-wrap';

  const isSel = !!selected[key];
  const btn = document.createElement('button');
  btn.className = 'itembtn' + (isSel ? ' selected':'');
  btn.innerHTML = `<span class="desc">${name}</span><span class="ref">REF ${ref}</span>` +
                   (isSel ? `<span class="qtytag">Qty ${selected[key].qty}</span>` : '');
  btn.onclick = ()=> toggleItem(systemId, ref, name, groupLabel, category);
  wrap.appendChild(btn);

  container.appendChild(wrap);
}

function renderGroupHead(container, systemId, category, group, labelPrefix){
  const headEl = document.createElement('div');
  headEl.className = 'group-head';

  const left = document.createElement('div');
  left.className = 'headleft';
  const labelSpan = document.createElement('span');
  labelSpan.textContent = labelPrefix ? `${labelPrefix} — ${group.label}` : group.label;
  left.appendChild(labelSpan);
  if(group.pendingNote){
    const badge = document.createElement('span');
    badge.className = 'pending-badge';
    badge.textContent = '⏳ Not yet available for sale';
    badge.title = group.pendingNote;
    left.appendChild(badge);
  }
  if(group.note){
    const nb = document.createElement('span');
    nb.className = 'note-badge';
    nb.textContent = 'i';
    nb.title = group.note;
    left.appendChild(nb);
  }
  headEl.appendChild(left);

  const right = document.createElement('div');
  right.className = 'headright';
  if(group.material){
    const mat = document.createElement('span');
    mat.className = 'material';
    mat.textContent = group.material;
    right.appendChild(mat);
  }
  headEl.appendChild(right);

  container.appendChild(headEl);

  // Where the article numbers come from, so whoever orders can check the
  // catalog page. Hover shows the full catalog title.
  if(group.source || group.unverified){
    const src = document.createElement('div');
    src.className = 'group-source';
    if(group.source){
      const s = document.createElement('span');
      s.textContent = 'Source: ' + group.source;
      s.title = Object.keys(CATALOG_SOURCES).filter(k=>group.source.includes(k)).map(k=>CATALOG_SOURCES[k]).join('\n');
      src.appendChild(s);
    }
    if(group.unverified){
      const u = document.createElement('span');
      u.className = 'unverified';
      u.textContent = '⚠ ' + group.unverified + ' — confirm before ordering';
      src.appendChild(u);
    }
    container.appendChild(src);
  }
}

/* ---------- Render category / search view ---------- */
const ICON_IMPLANT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.6c0-1.1 1.6-2 3.5-2s3.5.9 3.5 2-1.6 2-3.5 2-3.5-.9-3.5-2z"/><line x1="12" y1="5.6" x2="12" y2="8"/><path d="M9 8h6l-1 10.3-2 3.1-2-3.1z"/><line x1="9.3" y1="10" x2="14.7" y2="10"/><line x1="9.5" y1="12" x2="14.5" y2="12"/><line x1="9.7" y1="14" x2="14.3" y2="14"/><line x1="10" y1="16" x2="14" y2="16"/></svg>`;
const ICON_ARCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.2c0 5.9 4 10.3 9 10.3s9-4.4 9-10.3"/><path d="M4.3 7c2.3 1.9 4.9 2.9 7.7 2.9S17.4 8.9 19.7 7"/><line x1="7.1" y1="9.5" x2="7.7" y2="12.4"/><line x1="10.5" y1="10.7" x2="10.7" y2="13.6"/><line x1="13.5" y1="10.7" x2="13.3" y2="13.6"/><line x1="16.9" y1="9.5" x2="16.3" y2="12.4"/></svg>`;
const ICON_BOOK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8c-1.7-1.3-3.8-1.9-5.9-1.9-.7 0-1.3.6-1.3 1.3v11c0 .7.6 1.3 1.3 1.3 2.1 0 4.2.6 5.9 1.9 1.7-1.3 3.8-1.9 5.9-1.9.7 0 1.3-.6 1.3-1.3v-11c0-.7-.6-1.3-1.3-1.3-2.1 0-4.2.6-5.9 1.9z"/><line x1="12" y1="6.8" x2="12" y2="19.4"/></svg>`;

/* Fades the current view out, runs the navigation, then fades the new view
   in — used for every top-level navigation (Home, system tabs,
   Favorites, and the three Home-screen buttons) so switching views reads
   as a deliberate transition rather than an instant content swap. */
function navigateWithFade(fn){
  const app = document.getElementById('appRoot');
  app.classList.add('nav-fade');
  setTimeout(()=>{
    fn();
    const raf = window.requestAnimationFrame || (cb => setTimeout(cb, 16));
    raf(()=> app.classList.remove('nav-fade'));
  }, 140);
}

async function pickSystemAndGo(promptTitle, systemIds, message){
  return await showModal({
    type:'select', title:promptTitle, message,
    options: systemIds.map(id => ({ value:id, label: SYSTEMS[id].name }))
  });
}

/* Tags every order line whose quantity increased since `before` with the
   given tooth number (deduped, new array each time — never mutated in
   place — so snapshot/restore for Back navigation stays safe). Used by the
   guided Single/Bridge wizard so a bridge case's order list can show which
   tooth each part belongs to, even when two teeth end up needing the exact
   same REF (their quantities just merge onto one line, tagged with both
   tooth numbers, rather than the order gaining a duplicate row for
   something you'd actually order as one combined quantity). */
function tagTeethForNewAdditions(before, toothNumber){
  Object.keys(selected).forEach(key=>{
    const beforeQty = before[key] ? before[key].qty : 0;
    if(selected[key].qty > beforeQty){
      const existing = selected[key].teeth || [];
      if(!existing.includes(toothNumber)) selected[key].teeth = [...existing, toothNumber];
    }
  });
}

let currentTreatmentPlan = null; // {type:'single'|'bridge', implants:[...], pontics:[...]} — shown atop the order panel

async function startSingleOrBridgeWizard(){
  const treatType = await showModal({
    type:'select', title:'What are you treating?',
    options:[
      {value:'single', label:'Single Implant Crown(s)'},
      {value:'bridge', label:'Implant-Supported Bridge'}
    ]
  });
  if(!treatType) return;

  const odoResult = await showModal({
    type:'odontogram', title:'Where are you placing implants?', mode: treatType,
    okText:'Continue'
  });
  if(!odoResult) return;

  // One system for the whole case — placing several implants in the same
  // visit means the same system almost always, so this is asked once up
  // front rather than re-asked for every tooth.
  const sysId = await pickSystemAndGo('Which Implant System?', SYSTEM_IDS);
  if(!sysId) return;
  const implantsCat = WIZARD_IMPLANTS_CATEGORY_NAME[sysId] || SYSTEMS[sysId].order[0];

  wizardActive = true;
  wizardAborted = false;
  wizardExitSnapshot = snapshotSelected();
  const previousTreatmentPlan = currentTreatmentPlan;
  currentTreatmentPlan = {type:treatType, implants:odoResult.implants, pontics:odoResult.pontics};
  renderOrder();

  try {
    const teeth = odoResult.implants;
    const toothSnapshots = []; // state right before each tooth's turn — lets Back undo one tooth and redo it
    let ti = 0;
    while(ti < teeth.length){
      if(wizardAborted) break;
      const tooth = teeth[ti];
      toothSnapshots[ti] = snapshotSelected();
      const result = await pickImplantsForCase(sysId, implantsCat, `Tooth #${tooth} — Pick Implant`, null, ti>0, {
        defaultQty: 1,
        afterAdd: (groupLabel) => maybeRunTreatmentWizard(sysId, groupLabel, implantsCat, 1, /*skipConfirm*/ true)
      });
      if(wizardAborted) break;
      if(result === '__PART_BACK__'){
        // Nothing was added for this tooth yet — undo the previous tooth's
        // picks instead and land back on it so it can be redone, exactly
        // like backing out of one part in the per-implant treatment wizard.
        restoreSelected(toothSnapshots[ti-1]);
        ti = ti-1;
        render();
        renderOrder();
        continue;
      }
      tagTeethForNewAdditions(toothSnapshots[ti], tooth);
      render();
      renderOrder();
      ti++;
    }
  } finally {
    if(wizardAborted){ currentTreatmentPlan = previousTreatmentPlan; renderOrder(); }
    wizardActive = false;
    wizardExitSnapshot = null;
  }

  if(!wizardAborted){
    navigateWithFade(()=>{
      viewMode = 'favorites';
      activeFavoritesCategory = FAVORITES_PRESET_CATEGORIES[0];
      resetFavoritesSystemIfInvalidForCategory();
      render();
    });
    showToast('Treatment plan complete — review your order');
  }
}

function render(){
  const appRoot = document.getElementById('appRoot');
  appRoot.classList.toggle('home-mode', viewMode==='home');
  document.getElementById('homeBtn').style.display = viewMode==='home' ? 'none' : 'flex';
  if(viewMode==='home'){ document.getElementById('pageMeta').innerHTML = ''; renderHomeView(); return; }

  buildSystemBar();
  buildSidebar();
  if(viewMode==='favorites'){ renderFavoritesView(); return; }

  const sys = SYSTEMS[activeSystemId];
  const container = document.getElementById('categoryView');
  container.innerHTML = '';

  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  const heading = document.createElement('div');
  if(query){
    heading.innerHTML = `<h2>Search results</h2><p class="subtitle">Matching "${escapeHtml(query)}" within ${sys.name}</p>`;
  } else {
    const allOnXNote = activeCategory === "All-on-X Components"
      ? ' — components already listed elsewhere in this catalog, grouped here for full-arch treatment planning'
      : '';
    heading.innerHTML = `<h2>${activeCategory}</h2><p class="subtitle">${sys.name} — tap a component to add it to your order${allOnXNote}</p>`;
  }
  container.appendChild(heading);

  if(!query && activeCategory === "All-on-X Components"){
    const wizardBtn = document.createElement('button');
    wizardBtn.className = 'allonx-wizard-btn';
    wizardBtn.innerHTML = '🦷 Launch All-on-X Case Wizard';
    wizardBtn.onclick = ()=> runAllOnXWizard(activeSystemId);
    container.appendChild(wizardBtn);
  }

  let anyResults = false;

  sys.order.forEach(cat=>{
    if(!query && cat!==activeCategory) return;
    sys.catalog[cat].forEach(group=>{
      let matchingItems = group.items.filter(([name,ref])=>{
        if(!query) return true;
        return (name.toLowerCase().includes(query) || ref.toLowerCase().includes(query) ||
                group.label.toLowerCase().includes(query) || cat.toLowerCase().includes(query));
      });
      if(matchingItems.length===0) return;
      anyResults = true;

      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      renderGroupHead(groupEl, activeSystemId, cat, group, group.sourceCategory || (query ? cat : null));

      const bodyEl = document.createElement('div');
      bodyEl.className = 'group-body';
      matchingItems.forEach(([name,ref])=>{
        renderItemCard(bodyEl, activeSystemId, name, ref, group.label, cat);
      });
      groupEl.appendChild(bodyEl);
      container.appendChild(groupEl);
    });
  });

  if(!anyResults){
    const p = document.createElement('div');
    p.className = 'no-results';
    p.textContent = 'No matching components found in this system.';
    container.appendChild(p);
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- Selection logic ---------- */
/* A "caution" on a catalog group (see e.g. the BLC Ø4.5mm implants, and
   FOLLOW-UP.md for the full list) means the data itself is a genuine open
   question, not a UI nice-to-have — so every path that can add an item
   from that group (manual catalog tap, guided wizards, the case wizard)
   routes through this same confirm gate rather than each needing its
   own copy of the warning. Returns true if there's nothing to confirm,
   or if the person confirms; false means "don't add, go back." */
async function confirmGroupCaution(systemId, category, groupLabel){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  if(!group || !group.caution) return true;
  return await showModal({
    type:'confirm', title:'Please confirm before adding',
    message: group.caution,
    okText:'Add anyway', cancelText:'Go back'
  });
}

async function toggleItem(systemId, ref, name, groupLabel, category){
  const key = systemId+'::'+ref;
  if(selected[key]){
    delete selected[key];
    render();
    renderOrder();
    return;
  }
  if(!(await confirmGroupCaution(systemId, category, groupLabel))) return;
  const packSize = parsePackSize(name, groupLabel);
  const packNote = packSize>1 ? `\n\nThis item ships ${packSize} per package. The number below is packages, not individual pieces.` : '';
  let qty = await showModal({type:'prompt', title:'Quantity', message:`${name}\n(${groupLabel})${packNote}`, defaultValue:'1', okText:'Add'});
  if(qty === null) return;
  qty = parseInt(qty,10);
  if(!qty || qty < 1) qty = 1;
  selected[key] = {name, group:groupLabel, category, qty, system:systemId, ref};
  render();
  renderOrder();

  await maybeRunTreatmentWizard(systemId, groupLabel, category, qty);
  await maybeOfferMultiUnitCap(systemId, category, groupLabel);
}
