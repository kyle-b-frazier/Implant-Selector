<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implant Parts Selector</title>
<style>
  :root{
    --navy:#00205B;
    --navy-deep:#001438;
    --green:#78BE21;
    --green-deep:#5C9418;
    --paper:#F2F4F7;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6572;
    --line:#E1E5EB;
    --amber:#C4740A;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, select{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  input[type=number]{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
    font-size:16px; /* iOS Safari auto-zooms on focus if an input's font is under 16px */
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr 340px;
    min-height:100vh;
    min-height:100dvh;
  }
  /* ---- Header ---- */
  .topbar{
    grid-column:1/-1;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--green);
  }
  .topbar .brand{display:flex; flex-direction:column; gap:2px;}
  .topbar .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--green);
    font-weight:700;
  }
  .topbar .brand h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .topbar .meta{font-size:11px; color:#B9C3DD; text-align:right; line-height:1.5;}
  .topbar .homebtn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; flex:0 0 auto;
    transition:background .15s ease, transform .12s ease;
  }
  .topbar .homebtn:hover{background:rgba(255,255,255,.16);}
  .topbar .homebtn:active{transform:scale(.92);}

  /* ---- Navigation fade transition ---- */
  .app.nav-fade .content, .app.nav-fade .sidebar, .app.nav-fade #homeView{
    opacity:0; transition:opacity .14s ease;
  }
  .content, .sidebar, #homeView{opacity:1; transition:opacity .18s ease;}

  /* ---- Button press feedback (general) ---- */
  button:active, .card:active{transform:scale(.97);}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}

  /* ---- Home screen ---- */
  .app.home-mode{grid-template-columns:1fr;}
  .app.home-mode .systembar, .app.home-mode .sidebar, .app.home-mode .orderpanel, .app.home-mode .content{display:none;}
  #homeView{display:none;}
  .app.home-mode #homeView{grid-column:1/-1; display:flex; justify-content:center; padding:40px 20px 60px; background:#EDEEF0; min-height:calc(100vh - 76px);}
  .home-card-outer{max-width:640px; width:100%; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.12); border:1px solid #d5d8dd; height:fit-content;}
  .home-hero{background:var(--navy); display:flex; align-items:center; gap:28px; padding:32px 36px; opacity:0; animation:homeFadeDown .5s ease-out forwards;}
  .home-hero .art{flex:0 0 auto; width:130px; height:130px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:var(--green); box-shadow:0 8px 24px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12);}
  .home-hero .art svg{width:62%; height:62%; display:block;}
  .home-hero .txt .eyebrow{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); font-weight:700; margin:0 0 8px;}
  .home-hero .txt h2{margin:0; font-size:26px; color:#fff; font-weight:700; letter-spacing:-.01em; line-height:1.2;}
  .home-btn-row{padding:26px 36px 34px; display:flex; flex-direction:column; gap:14px;}
  .home-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left; width:100%;
    font-family:inherit; opacity:0; animation:homeFadeUp .5s ease-out forwards;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .home-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,32,91,.14); border-color:#c9d6ea;}
  .home-card:nth-child(1){animation-delay:.16s;}
  .home-card:nth-child(2){animation-delay:.26s;}
  .home-card:nth-child(3){animation-delay:.36s;}
  .home-card .hc-icon{
    width:46px; height:46px; border-radius:10px; background:#EAF4DC; color:#4F8A16;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:background .18s ease, transform .18s ease;
  }
  .home-card:hover .hc-icon{background:#DCEFC4; transform:scale(1.06);}
  .home-card .hc-icon svg{width:24px; height:24px;}
  .home-card .hc-txt h3{margin:0 0 3px; font-size:15px; color:var(--ink); font-weight:700;}
  .home-card .hc-txt p{margin:0; font-size:12.5px; color:var(--ink-soft);}
  .home-card .hc-arrow{margin-left:auto; color:#9AA3AF; font-size:18px; transition:transform .18s ease;}
  .home-card:hover .hc-arrow{transform:translateX(3px); color:var(--green-deep);}
  @keyframes homeFadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes homeFadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (max-width:640px){
    .home-hero{flex-direction:column; text-align:center; padding:28px 24px;}
    .home-hero .art{width:110px; height:110px;}
  }

  /* ---- Odontogram (tooth chart) ---- */
  .odo-wrap{padding:4px 0 8px;}
  .odo-legend{display:flex; gap:16px; margin-bottom:14px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .odo-legend span{display:inline-flex; align-items:center; gap:5px;}
  .odo-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .odo-arch{display:flex; justify-content:center; gap:4px; margin-bottom:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px;}
  .odo-arch.lower{margin-bottom:0; margin-top:10px;}
  .odo-tooth{
    width:28px; height:36px; border-radius:6px 6px 9px 9px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .1s ease, background .12s ease, border-color .12s ease, color .12s ease;
    flex:0 0 auto;
  }
  .odo-arch.upper .odo-tooth{align-self:flex-end;}
  .odo-arch.lower .odo-tooth{align-self:flex-start; border-radius:9px 9px 6px 6px;}
  .odo-tooth:hover{border-color:#9AA3AF;}
  .odo-tooth:active{transform:scale(.92);}
  .odo-tooth.implant{background:var(--green); border-color:var(--green-deep); color:#fff;}
  .odo-tooth.pontic{background:#F3D48A; border-color:#C99A2E; color:#5A430E;}
  .odo-arch-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); text-align:center; margin:2px 0;}
  .odo-summary{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:14px; min-height:18px;}
  .odo-summary b{color:var(--ink);}
  @media (max-width:480px){
    .modal-overlay{padding:8px;}
    .modal-box.modal-grouped{padding:10px;}
    .odo-tooth{width:17px; height:27px; font-size:8.5px; border-radius:3px 3px 6px 6px;}
    .odo-arch.lower .odo-tooth{border-radius:6px 6px 3px 3px;}
    .odo-arch{gap:1px;}
  }

  /* ---- Treatment plan summary (order panel) ---- */
  .treatment-plan-card{
    background:#EAF4DC; border:1px solid #C9E0A5; border-radius:10px; padding:12px 14px; margin-bottom:14px;
    font-size:12px; color:#3E6310; line-height:1.5;
  }
  .treatment-plan-card .tp-title{font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;}
  .treatment-plan-card .tp-clear{background:none; border:none; color:#3E6310; text-decoration:underline; font-size:11px; cursor:pointer; padding:0;}
  .order-row .tooth-tag{
    display:inline-block; background:#EAF4DC; color:#4F8A16; border-radius:5px; padding:1px 6px;
    font-size:10px; font-weight:700; margin-left:6px; font-family:var(--sans);
  }

  /* ---- System switcher ---- */
  .systembar{
    grid-column:1/-1;
    background:var(--navy-deep);
    display:flex;
    gap:8px;
    padding:10px 28px;
    overflow-x:auto;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .systembar button.sysbtn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    background:rgba(255,255,255,.05);
    border:1.5px solid rgba(255,255,255,.1);
    color:#B9C3DD;
    border-radius:9px;
    padding:8px 16px;
    cursor:pointer;
    font-family:var(--sans);
    transition:all .12s;
    white-space:nowrap;
  }
  .systembar button.sysbtn .sysname{font-size:12.5px; font-weight:700;}
  .systembar button.sysbtn .syssub{font-size:9.5px; color:#8493B8; letter-spacing:.02em;}
  .systembar button.sysbtn:hover{border-color:var(--green); color:#fff;}
  .systembar button.sysbtn.active{
    background:var(--green);
    border-color:var(--green);
    color:#0E2B00;
  }
  .systembar button.sysbtn.active .sysname{color:#0E2B00;}
  .systembar button.sysbtn.active .syssub{color:#274600;}
  .systembar button.favtab .sysname{color:var(--green);}
  .systembar button.favtab:hover{border-color:var(--green);}
  .systembar button.favtab:hover .sysname{color:#fff;}
  .systembar button.favtab.active{
    background:var(--green);
    border-color:var(--green);
  }
  .systembar button.favtab.active .sysname{color:#0E2B00;}
  .systembar button.favtab.active .syssub{color:#274600;}
  .systembar button.first-system-tab{
    margin-left:10px;
    padding-left:18px;
    border-left:1.5px solid rgba(255,255,255,.15);
  }

  /* ---- Sidebar (categories) ---- */
  .sidebar{
    background:var(--navy);
    padding:18px 0;
    overflow-y:auto;
  }
  .sidebar .sidebar-section{
    padding:14px 18px 6px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--green);
    opacity:.85;
  }
  .sidebar .sidebar-section:not(:first-child){
    margin-top:6px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .sidebar button.catbtn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#C4CEE6;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .12s, color .12s;
  }
  .sidebar button.catbtn .count{
    margin-left:auto;
    font-size:10px;
    background:rgba(255,255,255,.08);
    color:#9FADCE;
    border-radius:10px;
    padding:1px 7px;
    font-family:var(--mono);
  }
  .sidebar button.catbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
  .sidebar button.catbtn.active{
    background:rgba(120,190,33,.14);
    color:#fff;
    border-left-color:var(--green);
  }
  .sidebar button.catbtn.active .count{background:var(--green); color:var(--navy-deep);}

  /* ---- Main content ---- */
  .content{
    padding:26px 30px 60px;
    overflow-y:auto;
  }
  .content h2{
    margin:0 0 4px;
    font-size:22px;
    color:var(--navy);
    letter-spacing:-.01em;
  }
  .content .subtitle{
    margin:0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .searchwrap{margin-bottom:20px;}
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13px;
    font-family:var(--sans);
    background:#fff;
  }
  .searchwrap input:focus{outline:2px solid var(--green); border-color:var(--green);}

  .group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .group-head{
    padding:11px 16px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:.01em;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .group-head .headleft{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .group-head .headright{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .group-head .material{
    font-size:10px;
    font-weight:700;
    color:var(--green-deep);
    background:#EEF7E1;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .group-body{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 14px;
  }
  .itembtn-wrap{
    position:relative;
    min-width:150px;
  }
  .itembtn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    width:100%;
    min-width:150px;
    padding:9px 12px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-family:var(--sans);
    text-align:left;
    transition:border-color .12s, background .12s, transform .06s;
  }
  .itembtn:hover{border-color:var(--navy); transform:translateY(-1px);}
  .itembtn .desc{font-size:12px; font-weight:600; color:var(--ink);}
  .itembtn .ref{font-size:10.5px; font-family:var(--mono); color:var(--ink-soft);}
  .itembtn.selected{
    background:var(--green);
    border-color:var(--green-deep);
  }
  .itembtn.selected .desc{color:#0E2B00;}
  .itembtn.selected .ref{color:#274600;}
  .itembtn .qtytag{
    align-self:flex-end;
    font-size:10px;
    font-weight:700;
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    padding:1px 7px;
    margin-top:2px;
  }
  .fav-bucket{margin-bottom:22px;}
  .fav-bucket-head{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    padding-bottom:6px;
    margin-bottom:10px;
    border-bottom:2px solid var(--green);
  }
  .fav-system-head{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin:12px 0 6px;
  }
  .sys-filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:2px 0 16px;
    flex-wrap:wrap;
  }
  .sys-filter-row label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .sys-filter-row select{
    padding:8px 12px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--navy);
    font-size:13px;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    min-width:200px;
  }
  .sys-filter-row select:focus{outline:2px solid var(--green); border-color:var(--green);}
  .allonx-wizard-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:14px 18px;
    margin-bottom:14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    font-family:var(--sans);
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,32,91,.25);
    transition:transform .1s, box-shadow .1s;
  }
  .allonx-wizard-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 16px rgba(0,32,91,.32);
    background:linear-gradient(135deg,var(--navy) 0%,var(--green-deep) 140%);
  }
  .mismatch-banner{
    background:#FDF2E9;
    border:1.5px solid #E8A23D;
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 12px;
    font-size:11.5px;
    color:#7A4A0E;
    line-height:1.5;
  }
  .mismatch-banner .mismatch-title{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:4px;
  }
  .mismatch-banner ul{margin:0; padding-left:18px;}
  .pending-badge{
    display:inline-block;
    background:#FDF2E9;
    border:1px solid #E8A23D;
    color:#7A4A0E;
    border-radius:5px;
    padding:2px 7px;
    font-size:10px;
    font-weight:700;
    margin-left:8px;
    white-space:nowrap;
  }
  /* Small "i" info badge for a per-group heads-up (e.g. a length or
     sourcing caveat) that doesn't rise to the level of a regulatory
     pending-badge. Hover/focus reveals the detail via native tooltip
     instead of the caveat living permanently in the label text. */
  .note-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#EAF1FB;
    border:1px solid #B7CCEC;
    color:#2C5AA0;
    font-size:10px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    flex:0 0 auto;
  }
  /* Same "i" treatment, sized for the dark topbar next to pageMeta. */
  .meta-note{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    margin-left:6px;
    flex:0 0 auto;
    vertical-align:middle;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,20,56,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    max-width:400px;
    width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    position:relative;
  }
  .modal-exit-x{
    position:absolute;
    top:12px;
    right:12px;
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-exit-x:hover{background:#F1F2F4; color:var(--ink);}
  .modal-box h3{
    margin:0 0 8px;
    color:var(--navy);
    font-size:16px;
    font-weight:700;
  }
  .modal-box p{
    margin:0 0 16px;
    color:var(--ink);
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .modal-box input[type=number]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:16px;
    margin-bottom:18px;
    font-family:var(--sans);
  }
  .modal-box input[type=number]:focus{outline:2px solid var(--green); border-color:var(--green);}
  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .modal-actions button{
    padding:11px 20px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    font-family:var(--sans);
  }
  .modal-btn-cancel{background:#EEF0F3; color:var(--ink);}
  .modal-btn-back{background:#fff; border:1.5px solid var(--line); color:var(--navy); margin-right:auto;}

  .modal-select-row{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;

    background:#fff;

  .modal-checkqty-row{
    display:flex;

    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);

    color:var(--ink);

  .modal-checkqty-row .cq-label{font-weight:600; display:block;}
  .modal-checkqty-row .cq-sub{font-size:11px; color:var(--ink-soft); font-family:var(--mono); display:block; margin-top:2px;}

  }

    resize:vertical;

    width:100%;
    margin-top:10px;
    padding:12px;
    background:var(--green);
    color:#0E2B00;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s;
  }
  .copybtn:hover{background:var(--green-deep); color:#fff;}

    width:100%;
    margin-top:8px;
    padding:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  .clearbtn:hover{border-color:#C0392B; color:#C0392B;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep);
    color:#fff;
    padding:10px 22px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:all .25s;
    border:1px solid var(--green);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

    .app{grid-template-columns:1fr;}

/* All-on-X Components: a convenience grouping for full-arch treatment
   planning. Every item here already exists in its home category above —
   nothing is removed from there. Assigned last so lookups elsewhere still
   resolve to an item's true home category. Each duplicated group is tagged
   with sourceCategory so its on-screen label always reads with its true,
   full component name (e.g. "Screw-retained / Multi-unit Abutments —
   Angled 30° (sterile)") instead of a bare "Angled 30° (sterile)". */
function withSource(groups, sourceCategory){
  return groups.map(g => ({...g, sourceCategory}));
}

  ...withSource(CATALOG_BLC["Screw-retained / Multi-unit Abutments"], "Screw-retained / Multi-unit Abutments"),

];

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  if(viewMode==='favorites'){
    FAVORITES_PRESET_CATEGORIES.forEach(pc=>{
      const idsForCount = pc === "All-on-X Components" ? FAVORITES_ALLONX_SYSTEM_IDS : SYSTEM_IDS;
      const count = idsForCount.reduce((n,sid)=>{
        const groups = (FAVORITES_PRESET[sid] && FAVORITES_PRESET[sid][pc]) || [];
        return n + groups.reduce((m,g)=>m+g.items.length, 0);
      }, 0);

      btn.className = 'catbtn' + (pc===activeFavoritesCategory ? ' active':'');
      btn.innerHTML = `<span>${pc}</span><span class="count">${count}</span>`;
      btn.onclick = ()=>{ activeFavoritesCategory = pc; resetFavoritesSystemIfInvalidForCategory(); document.getElementById('searchBox').value=''; render(); };
      sb.appendChild(btn);
    });
    return;
  }

  const sys = SYSTEMS[activeSystemId];
  let lastSection = null;
  sys.order.forEach(cat=>{
    const section = sectionOf(sys, cat);
    if(section !== lastSection){
      const div = document.createElement('div');
      div.className = 'sidebar-section';
      div.textContent = section;
      sb.appendChild(div);
      lastSection = section;

    const count = sys.catalog[cat].reduce((n,g)=>n+g.items.length,0);
    const btn = document.createElement('button');
    btn.className = 'catbtn' + (cat===activeCategory ? ' active':'');
    btn.innerHTML = `<span>${cat}</span><span class="count">${count}</span>`;
    btn.onclick = ()=>{ activeCategory = cat; viewMode = 'category'; document.getElementById('searchBox').value=''; render(); };
    sb.appendChild(btn);
  });

/* Fades the current view out, runs the navigation, then fades the new view
   in — used for every top-level navigation (Home, system tabs,
   Favorites, and the three Home-screen buttons) so switching views reads
   as a deliberate transition rather than an instant content swap. */
function navigateWithFade(fn){
  const app = document.getElementById('appRoot');
  app.classList.add('nav-fade');
  setTimeout(()=>{
    fn();
    const raf = window.requestAnimationFrame || (cb => setTimeout(cb, 16));
    raf(()=> app.classList.remove('nav-fade'));
  }, 140);
}

/* Tags every order line whose quantity increased since `before` with the
   given tooth number (deduped, new array each time — never mutated in
   place — so snapshot/restore for Back navigation stays safe). Used by the
   guided Single/Bridge wizard so a bridge case's order list can show which
   tooth each part belongs to, even when two teeth end up needing the exact
   same REF (their quantities just merge onto one line, tagged with both
   tooth numbers, rather than the order gaining a duplicate row for
   something you'd actually order as one combined quantity). */
function tagTeethForNewAdditions(before, toothNumber){
  Object.keys(selected).forEach(key=>{
    const beforeQty = before[key] ? before[key].qty : 0;
    if(selected[key].qty > beforeQty){
      const existing = selected[key].teeth || [];
      if(!existing.includes(toothNumber)) selected[key].teeth = [...existing, toothNumber];
    }
  });
}

let currentTreatmentPlan = null; // {type:'single'|'bridge', implants:[...], pontics:[...]} — shown atop the order panel

async function startSingleOrBridgeWizard(){
  const treatType = await showModal({
    type:'select', title:'What are you treating?',
    options:[
      {value:'single', label:'Single Implant Crown(s)', sublabel:'One or more independent implants, each its own crown — no shared prosthesis'},
      {value:'bridge', label:'Implant-Supported Bridge', sublabel:'Multiple implants supporting one connected prosthesis, may include pontics'}
    ]
  });
  if(!treatType) return;

  const odoResult = await showModal({
    type:'odontogram', title:'Where are you placing implants?', mode: treatType,
    okText:'Continue'
  });
  if(!odoResult) return;

  // One system for the whole case — placing several implants in the same
  // visit means the same system almost always, so this is asked once up
  // front rather than re-asked for every tooth.
  const sysId = await pickSystemAndGo('Which Implant System?', SYSTEM_IDS);
  if(!sysId) return;
  const implantsCat = WIZARD_IMPLANTS_CATEGORY_NAME[sysId] || SYSTEMS[sysId].order[0];

  wizardActive = true;
  wizardAborted = false;
  wizardExitSnapshot = snapshotSelected();
  const previousTreatmentPlan = currentTreatmentPlan;
  currentTreatmentPlan = {type:treatType, implants:odoResult.implants, pontics:odoResult.pontics};
  renderOrder();

  try {
    const teeth = odoResult.implants;
    const toothSnapshots = []; // state right before each tooth's turn — lets Back undo one tooth and redo it
    let ti = 0;
    while(ti < teeth.length){
      if(wizardAborted) break;
      const tooth = teeth[ti];
      toothSnapshots[ti] = snapshotSelected();
      const result = await pickImplantsForCase(sysId, implantsCat, `Tooth #${tooth} — Pick Implant`, null, ti>0, {
        defaultQty: 1,
        afterAdd: (groupLabel) => maybeRunTreatmentWizard(sysId, groupLabel, implantsCat, 1, /*skipConfirm*/ true)
      });
      if(wizardAborted) break;
      if(result === '__PART_BACK__'){
        // Nothing was added for this tooth yet — undo the previous tooth's
        // picks instead and land back on it so it can be redone, exactly
        // like backing out of one part in the per-implant treatment wizard.
        restoreSelected(toothSnapshots[ti-1]);
        ti = ti-1;
        render();
        renderOrder();
        continue;
      }
      tagTeethForNewAdditions(toothSnapshots[ti], tooth);
      render();
      renderOrder();
      ti++;
    }
  } finally {
    if(wizardAborted){ currentTreatmentPlan = previousTreatmentPlan; renderOrder(); }
    wizardActive = false;
    wizardExitSnapshot = null;
  }

  if(!wizardAborted){
    navigateWithFade(()=>{
      viewMode = 'favorites';
      activeFavoritesCategory = FAVORITES_PRESET_CATEGORIES[0];
      resetFavoritesSystemIfInvalidForCategory();
      render();
    });
    showToast('Treatment plan complete — review your order');
  }
}

function render(){
  const appRoot = document.getElementById('appRoot');
  appRoot.classList.toggle('home-mode', viewMode==='home');
  document.getElementById('homeBtn').style.display = viewMode==='home' ? 'none' : 'flex';
  if(viewMode==='home'){ document.getElementById('pageMeta').innerHTML = ''; renderHomeView(); return; }

  buildSystemBar();
  buildSidebar();
  if(viewMode==='favorites'){ renderFavoritesView(); return; }

  const sys = SYSTEMS[activeSystemId];
  const container = document.getElementById('categoryView');
  container.innerHTML = '';

  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  const heading = document.createElement('div');
  if(query){
    heading.innerHTML = `<h2>Search results</h2><p class="subtitle">Matching "${escapeHtml(query)}" within ${sys.name}</p>`;
  } else {
    const allOnXNote = activeCategory === "All-on-X Components"
      ? ' — components already listed elsewhere in this catalog, grouped here for full-arch treatment planning'
      : '';
    heading.innerHTML = `<h2>${activeCategory}</h2><p class="subtitle">${sys.name} — tap a component to add it to your order${allOnXNote}</p>`;
  }
  container.appendChild(heading);

  if(!query && activeCategory === "All-on-X Components"){
    const wizardBtn = document.createElement('button');
    wizardBtn.className = 'allonx-wizard-btn';
    wizardBtn.innerHTML = '🦷 Launch All-on-X Case Wizard';
    wizardBtn.onclick = ()=> runAllOnXWizard(activeSystemId);
    container.appendChild(wizardBtn);
  }

  let anyResults = false;

  sys.order.forEach(cat=>{
    if(!query && cat!==activeCategory) return;
    sys.catalog[cat].forEach(group=>{
      let matchingItems = group.items.filter(([name,ref])=>{
        if(!query) return true;
        return (name.toLowerCase().includes(query) || ref.toLowerCase().includes(query) ||
                group.label.toLowerCase().includes(query) || cat.toLowerCase().includes(query));
      });
      if(matchingItems.length===0) return;
      anyResults = true;

      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      renderGroupHead(groupEl, activeSystemId, cat, group, group.sourceCategory || (query ? cat : null));

      const bodyEl = document.createElement('div');
      bodyEl.className = 'group-body';
      matchingItems.forEach(([name,ref])=>{
        renderItemCard(bodyEl, activeSystemId, name, ref, group.label, cat);
      });
      groupEl.appendChild(bodyEl);
      container.appendChild(groupEl);
    });
  });

  if(!anyResults){
    const p = document.createElement('div');
    p.className = 'no-results';
    p.textContent = 'No matching components found in this system.';
    container.appendChild(p);
  }
}

  const catsToShow = query ? FAVORITES_PRESET_CATEGORIES : [activeFavoritesCategory];
  const systemsToShow = activeFavoritesSystem ? [activeFavoritesSystem] : (onAllOnXTab ? FAVORITES_ALLONX_SYSTEM_IDS : SYSTEM_IDS);

  systemsToShow.forEach(sid=>{
    const presetForSys = FAVORITES_PRESET[sid];
    if(!presetForSys) return;

    let groupsToShow = [];
    catsToShow.forEach(pc=> groupsToShow.push(...(presetForSys[pc]||[])));

    if(query){
      groupsToShow = groupsToShow
        .map(group=>{
          const labelMatches = group.label.toLowerCase().includes(query);
          const matchingItems = group.items.filter(([name,ref])=>
            labelMatches || name.toLowerCase().includes(query) || ref.toLowerCase().includes(query));
          return matchingItems.length ? {...group, items: matchingItems} : null;
        })
        .filter(Boolean);
    }

    if(groupsToShow.length===0) return;
    anyResults = true;

    const sysHead = document.createElement('div');

  if(!anyResults){
    const p = document.createElement('div');
    p.className = 'no-results';
    p.textContent = query ? 'No matching components in Favorites.' : 'Nothing in this category.';

function escapeHtml(s){

/* ---------- Selection logic ---------- */
/* A "caution" on a catalog group (see e.g. the unverified Nobel WP
   Ø6.5mm healing abutment) means the data itself is a genuine open
   question, not a UI nice-to-have — so every path that can add an item
   from that group (manual catalog tap, guided wizards, the case wizard)
   routes through this same confirm gate rather than each needing its
   own copy of the warning. Returns true if there's nothing to confirm,
   or if the person confirms; false means "don't add, go back." */
async function confirmGroupCaution(systemId, category, groupLabel){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  if(!group || !group.caution) return true;
  return await showModal({
    type:'confirm', title:'Please confirm before adding',
    message: group.caution,
    okText:'Add anyway', cancelText:'Go back'
  });
}

async function toggleItem(systemId, ref, name, groupLabel, category){
  const key = systemId+'::'+ref;
  if(selected[key]){
    delete selected[key];
    render();
    renderOrder();
    return;
  }
  if(!(await confirmGroupCaution(systemId, category, groupLabel))) return;
  const packSize = parsePackSize(name, groupLabel);
  const packNote = packSize>1 ? `\n\nThis item ships ${packSize} per package. The number below is packages, not individual pieces.` : '';
  let qty = await showModal({type:'prompt', title:'Quantity', message:`${name}\n(${groupLabel})${packNote}`, defaultValue:'1', okText:'Add'});
  if(qty === null) return;
  qty = parseInt(qty,10);
  if(!qty || qty < 1) qty = 1;
  selected[key] = {name, group:groupLabel, category, qty, system:systemId, ref};
  render();
  renderOrder();

  await maybeRunTreatmentWizard(systemId, groupLabel, category, qty);
  await maybeOfferMultiUnitCap(systemId, category, groupLabel);
}

function updateQty(key, val){
  let q = parseInt(val,10);
  if(!q || q<1) q = 1;
  if(selected[key]) selected[key].qty = q;
  renderOrder(false);
}

function removeItem(key){
  delete selected[key];
  render();
  renderOrder();
}

async function clearAll(){
  if(Object.keys(selected).length===0) return;
  const ok = await showModal({type:'confirm', title:'Clear order?', message:'Clear all selected items across all systems?', okText:'Clear'});
  if(ok){
    selected = {};
    currentTreatmentPlan = null;
    render();
    renderOrder();
  }
}

/* ---------- Order panel ---------- */
/* ---------- Platform cross-check ----------
   Detects likely platform/diameter mismatches within an order: e.g. an
   RB-platform implant selected alongside a WB-platform cover screw for the
   same system. Deliberately permissive — a single order can legitimately
   contain multiple platforms (e.g. a 3.3mm RB implant for one site and a
   5.0mm WB implant for another), so this only flags a component whose
   platform doesn't match ANY implant platform present for that system in
   the order. Zygoma parts are also checked for implant surface generation
   (TiUltra vs TiUnite), and Neodent implant analogs for implant diameter
   (Neodent has one GM connection, so it has no platform check). */
const PLATFORM_CHECK_CATEGORY_NAME = {
  blc:"Implants", blx:"Implants", blt:"Implants",
  nrcc:"Implants", nact:"Implants", npcc:"Implants",
  nas:"Implants", nps:"Implants", nrs:"Implants",
  nzcc:"Implants", nzeh:"Implants",
  gm:"Implants — Helix GM®" // no platforms, but its implant analogs are diameter-specific
};
/* Every platform a label names. A part labelled for two platforms
   ("RB/WB", "RP/WP", "NC/RC") fits exactly those two — never a third one,
   so this returns all of them rather than collapsing to "unspecified".
   An empty list means the label doesn't name a platform at all. */
const NOBEL_PLATFORM_SYSTEMS = new Set(['nrcc','nact','npcc','nas','nps','nrs','nzcc','nzeh']);
function platformTokens(systemId, text){
  const t = text || '';
  const tokens = [];
  if(systemId==='blc' || systemId==='blx'){
    if(/\bRB\b/.test(t)) tokens.push('RB');
    if(/\bWB\b/.test(t)) tokens.push('WB');
  } else if(NOBEL_PLATFORM_SYSTEMS.has(systemId)){
    if(/\bNP\b/.test(t)) tokens.push('NP');
    if(/\bRP\b/.test(t)) tokens.push('RP');
    if(/\bWP\b/.test(t)) tokens.push('WP');
    if(/\b3\.0(?![\d.])/.test(t)) tokens.push('3.0'); // e.g. "3.0 Platform" — not "3.0mm" mid-number
  } else if(systemId==='blt'){
    if(/\bSC\b/.test(t)) tokens.push('SC');
    if(/\bNC\b/.test(t)) tokens.push('NC');
    if(/\bRC\b/.test(t)) tokens.push('RC');
  }
  return tokens; // Neodent (gm): one GM connection for every diameter, nothing to check
}

/* NobelActive and NobelParallel CC implant groups are labeled only by
   diameter ("NobelActive® — Ø3.5mm"), with no NP/RP/WP text — unlike
   NobelReplace CC, which spells the platform out. Confirmed against
   Nobel Biocare's own shop listings (e.g. NobelActive RP 5.0mm — note
   5.0mm is RP, not WP; only 5.5mm is WP). Used only as a fallback, and
   only for these two systems' Implants category. */
const NACT_NPCC_DIAMETER_TO_PLATFORM = [
  [3.0, '3.0'], [3.5, 'NP'], [3.75, 'NP'], [4.3, 'RP'], [5.0, 'RP'], [5.5, 'WP']
];
function diameterPlatformFallback(text){
  const m = text.match(/Ø\s*([\d.]+)\s*mm/);
  if(!m) return null;
  const dia = parseFloat(m[1]);
  const found = NACT_NPCC_DIAMETER_TO_PLATFORM.find(([d])=>Math.abs(d-dia)<0.01);
  return found ? found[1] : null;
}

/* The single entry point everything else should use to find the set of
   platforms an item fits: checks the group label, then the item's own name
   (many Nobel groups bundle multiple platforms as separate items rather
   than separate groups — e.g. Cover Screws' one group holds "3.0 Platform"/
   "NP"/"RP"/"WP" as four items), then — for NobelActive/NobelParallel CC
   implants only — falls back to diameter. An empty set means the item
   names no platform and fits any implant in its system. */
function deriveItemPlatforms(systemId, category, groupLabel, itemName){
  let tokens = platformTokens(systemId, groupLabel);
  if(!tokens.length) tokens = platformTokens(systemId, itemName);
  if(!tokens.length && (systemId==='nact' || systemId==='npcc') && WIZARD_IMPLANTS_CATEGORY_NAME[systemId] === category){
    const p = diameterPlatformFallback((groupLabel||'') + ' ' + (itemName||''));
    if(p) tokens = [p];
  }
  return new Set(tokens);
}
function platformLabel(platforms){ return [...platforms].join('/'); }

/* Implant surface generation (TiUltra® vs TiUnite®). Only NobelZygoma
   pairs each surface generation with its own abutment line (TiUltra with
   the Xeal Zygoma abutments, TiUnite with the older external-hex ones), so
   only those two systems are filtered on it. Elsewhere — e.g. the S series
   and the conical-connection line — Xeal multi-unit abutments fit both
   TiUltra and TiUnite implants, so generation must not narrow anything. */
const GENERATION_SYSTEMS = new Set(['nzcc','nzeh']);
function generationTokens(systemId, text){
  if(!GENERATION_SYSTEMS.has(systemId)) return [];
  const t = text || '';
  const tokens = [];
  if(/TiUltra/i.test(t) || /\bXeal\b/i.test(t)) tokens.push('TiUltra');
  if(/TiUnite/i.test(t)) tokens.push('TiUnite');
  return tokens;
}
function deriveItemGenerations(systemId, groupLabel, itemName){
  let tokens = generationTokens(systemId, groupLabel);
  if(!tokens.length) tokens = generationTokens(systemId, itemName);
  return new Set(tokens);
}

/* Diameters listed in an item name such as "Ø3.5/3.75mm" or "Ø5.0/6.0/7.0mm"
   (Neodent's implant analogs are matched to implant diameter this way). */
function nameDiameters(text){
  const m = (text||'').match(/Ø\s*([\d.\/]+)\s*mm/);
  return m ? m[1].split('/').map(parseFloat).filter(n=>!isNaN(n)) : [];
}

/* An implant "profile" — every platform, surface generation and diameter
   a case's implants have. A single implant yields one of each; the
   All-on-X wizard accumulates them across every implant picked. */
function makeProfile(){ return {platforms:new Set(), generations:new Set(), diameters:new Set()}; }
function cloneProfile(p){ return {platforms:new Set(p.platforms), generations:new Set(p.generations), diameters:new Set(p.diameters)}; }
function mergeProfile(into, from){
  from.platforms.forEach(x=>into.platforms.add(x));
  from.generations.forEach(x=>into.generations.add(x));
  from.diameters.forEach(x=>into.diameters.add(x));
}
function implantProfileFor(systemId, category, groupLabel, itemName){
  const p = makeProfile();
  deriveItemPlatforms(systemId, category, groupLabel, itemName).forEach(x=>p.platforms.add(x));
  deriveItemGenerations(systemId, groupLabel, itemName).forEach(x=>p.generations.add(x));
  const d = nameDiameters(groupLabel)[0] || nameDiameters(itemName)[0];
  if(d) p.diameters.add(d);
  return p;
}
/* Accepts a profile, a platform string, or a Set of platforms (plus an
   optional generation) and always returns a profile. */
function toProfile(implantPlatform, implantGeneration){
  if(implantPlatform && implantPlatform.platforms instanceof Set) return implantPlatform;
  const p = makeProfile();
  if(implantPlatform instanceof Set) implantPlatform.forEach(x=>p.platforms.add(x));
  else if(implantPlatform) p.platforms.add(implantPlatform);
  if(implantGeneration instanceof Set) implantGeneration.forEach(x=>p.generations.add(x));
  else if(implantGeneration) p.generations.add(implantGeneration);
  return p;
}

/* Records a just-picked implant into a tracker — either a full profile
   (All-on-X case wizard) or a bare Set of platforms. */
function trackImplantProfile(tracker, systemId, category, groupLabel, itemName){
  if(!tracker) return;
  const picked = implantProfileFor(systemId, category, groupLabel, itemName);
  if(tracker.platforms instanceof Set) mergeProfile(tracker, picked);
  else if(tracker instanceof Set) picked.platforms.forEach(x=>tracker.add(x));
}

/* Whether one catalog item fits the implant(s) described by `profile`.
   A part that names platforms must share one with the implants; a part
   that names no platform fits any. Same for surface generation (zygoma
   only) and, for groups flagged `fitsImplantDiameters`, implant diameter.
   Never "falls back" to showing everything when nothing fits — offering
   another platform's part is exactly the mistake this exists to prevent. */
function partFits(systemId, category, group, itemName, profile){
  if(!profile) return true;
  const plats = deriveItemPlatforms(systemId, category, group.label, itemName);
  if(plats.size && profile.platforms.size && ![...plats].some(x=>profile.platforms.has(x))) return false;
  const gens = deriveItemGenerations(systemId, group.label, itemName);
  if(gens.size && profile.generations.size && ![...gens].some(x=>profile.generations.has(x))) return false;
  if(group.fitsImplantDiameters && profile.diameters.size){
    const ds = nameDiameters(itemName);
    if(ds.length && !ds.some(d=>[...profile.diameters].some(x=>Math.abs(x-d)<0.01))) return false;
  }
  return true;
}
