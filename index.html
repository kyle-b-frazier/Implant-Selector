<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implant Parts Selector</title>
<style>
  :root{
    --navy:#00205B;
    --navy-deep:#001438;
    --green:#78BE21;
    --green-deep:#5C9418;
    --paper:#F2F4F7;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6572;
    --line:#E1E5EB;
    --amber:#C4740A;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, select{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  input[type=number]{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
    font-size:16px; /* iOS Safari auto-zooms on focus if an input's font is under 16px */
  }
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr 340px;
    min-height:100vh;
    min-height:100dvh;
  }
  /* ---- Header ---- */
  .topbar{
    grid-column:1/-1;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--green);
  }
  .topbar .brand{display:flex; flex-direction:column; gap:2px;}
  .topbar .brand .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--green);
    font-weight:700;
  }
  .topbar .brand h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .topbar .meta{font-size:11px; color:#B9C3DD; text-align:right; line-height:1.5;}
  .topbar .homebtn{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; flex:0 0 auto;
    transition:background .15s ease, transform .12s ease;
  }
  .topbar .homebtn:hover{background:rgba(255,255,255,.16);}
  .topbar .homebtn:active{transform:scale(.92);}

  /* ---- Navigation fade transition ---- */
  .app.nav-fade .content, .app.nav-fade .sidebar, .app.nav-fade #homeView{
    opacity:0; transition:opacity .14s ease;
  }
  .content, .sidebar, #homeView{opacity:1; transition:opacity .18s ease;}

  /* ---- Button press feedback (general) ---- */
  button:active, .card:active{transform:scale(.97);}
  :focus-visible{outline:2px solid var(--green); outline-offset:2px;}

  /* ---- Home screen ---- */
  .app.home-mode{grid-template-columns:1fr;}
  .app.home-mode .systembar, .app.home-mode .sidebar, .app.home-mode .orderpanel, .app.home-mode .content{display:none;}
  #homeView{display:none;}
  .app.home-mode #homeView{grid-column:1/-1; display:flex; justify-content:center; padding:40px 20px 60px; background:#EDEEF0; min-height:calc(100vh - 76px);}
  .home-card-outer{max-width:640px; width:100%; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.12); border:1px solid #d5d8dd; height:fit-content;}
  .home-hero{background:var(--navy); display:flex; align-items:center; gap:28px; padding:32px 36px; opacity:0; animation:homeFadeDown .5s ease-out forwards;}
  .home-hero .art{flex:0 0 auto; width:130px; height:130px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:var(--green); box-shadow:0 8px 24px rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12);}
  .home-hero .art svg{width:62%; height:62%; display:block;}
  .home-hero .txt .eyebrow{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); font-weight:700; margin:0 0 8px;}
  .home-hero .txt h2{margin:0; font-size:26px; color:#fff; font-weight:700; letter-spacing:-.01em; line-height:1.2;}
  .home-btn-row{padding:26px 36px 34px; display:flex; flex-direction:column; gap:14px;}
  .home-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left; width:100%;
    font-family:inherit; opacity:0; animation:homeFadeUp .5s ease-out forwards;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .home-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,32,91,.14); border-color:#c9d6ea;}
  .home-card:nth-child(1){animation-delay:.16s;}
  .home-card:nth-child(2){animation-delay:.26s;}
  .home-card:nth-child(3){animation-delay:.36s;}
  .home-card .hc-icon{
    width:46px; height:46px; border-radius:10px; background:#EAF4DC; color:#4F8A16;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:background .18s ease, transform .18s ease;
  }
  .home-card:hover .hc-icon{background:#DCEFC4; transform:scale(1.06);}
  .home-card .hc-icon svg{width:24px; height:24px;}
  .home-card .hc-txt h3{margin:0 0 3px; font-size:15px; color:var(--ink); font-weight:700;}
  .home-card .hc-arrow{margin-left:auto; color:#9AA3AF; font-size:18px; transition:transform .18s ease;}
  .home-card:hover .hc-arrow{transform:translateX(3px); color:var(--green-deep);}
  @keyframes homeFadeDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes homeFadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (max-width:640px){
    .home-hero{flex-direction:column; text-align:center; padding:28px 24px;}
    .home-hero .art{width:110px; height:110px;}
  }

  /* ---- Explanatory drawings (diagrams.js) ---- */
  .dg-toggles{margin:-4px 0 14px;}
  .dg-row{display:flex; flex-wrap:wrap; gap:6px;}
  .dg-btn{border:1px solid #CFD8E6; background:#F4F7FC; color:var(--navy); border-radius:999px; padding:6px 12px; font:600 12.5px var(--sans); cursor:pointer;}
  .dg-btn:hover{border-color:var(--navy);}
  .dg-btn.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .dg{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px 8px; margin-top:8px; max-width:520px;}
  .dg-svg{display:block; width:100%; height:auto; border-radius:6px;}
  .dg-cap{font-size:13px; line-height:1.5; color:var(--ink); margin:8px 0 2px;}
  .dg-note{font-size:11px; color:var(--ink-soft); margin:0;}
  .cb-card .dg-row{margin-bottom:10px;}
  .cb-card .dg{margin:0 0 12px; border-color:#E6EAF0;}

  /* ---- Case builder (Single/Bridge and All-on-X) ---- */
  .app.builder-mode{grid-template-columns:1fr;}
  .app.builder-mode .systembar, .app.builder-mode .sidebar, .app.builder-mode .orderpanel, .app.builder-mode .content, .app.builder-mode #homeView{display:none;}
  #builderView{display:none;}
  .app.builder-mode #builderView{display:block; grid-column:1/-1; background:#EDEEF0; min-height:calc(100vh - 76px);}
  .cb-wrap{max-width:720px; margin:0 auto; padding:18px 16px 0;}
  .cb-head{margin:4px 2px 4px;}
  .cb-eyebrow{margin:0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--green-deep); font-weight:700;}
  .cb-head h2{margin:2px 0 0; font-size:22px; color:var(--navy);}
  .cb-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0;}
  .cb-card h3{margin:0 0 10px; font-size:15px; color:var(--navy); display:flex; align-items:center; gap:8px;}
  .cb-x{margin-left:auto; border:none; background:transparent; color:var(--ink-soft); font-size:15px; width:28px; height:28px; border-radius:6px; cursor:pointer;}
  .cb-x:hover{background:#F1F2F4; color:var(--ink);}
  .cb-lbl{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:12px 0 6px;}
  .cb-card > .cb-lbl:first-child{margin-top:0;}
  .cb-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .cb-chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:600; color:var(--ink); font-family:var(--sans); cursor:pointer; text-align:left; line-height:1.25;}
  .cb-chip:hover{border-color:#9AA3AF;}
  .cb-chip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .cb-variants{margin-bottom:10px;}
  .cb-seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px;}
  .cb-seg .cb-chip{flex:1; border:none; border-radius:0; text-align:center; border-right:1px solid var(--line);}
  .cb-seg .cb-chip:last-child{border-right:none;}
  .cb-arch{font-size:10px; color:var(--ink-soft); margin:4px 0 3px; letter-spacing:.06em; text-transform:uppercase;}
  .cb-odo{display:grid; grid-template-columns:repeat(16,1fr); gap:3px; margin-bottom:3px;}
  .cb-tooth{font:700 11px var(--sans); padding:8px 0; border:1.5px solid var(--line); border-radius:5px; color:var(--ink-soft); background:#fff; cursor:pointer; min-width:0;}
  .cb-tooth.implant{background:var(--green); border-color:var(--green-deep); color:#fff;}
  .cb-tooth.pontic{background:#F3D48A; border-color:#C99A2E; color:#5A430E;}
  .cb-note{font-size:12.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.45;}
  .cb-note b{color:var(--ink);}
  .cb-note.cb-top{margin:-4px 0 10px;}
  .cb-note.cb-axis{margin-top:6px; font-size:11.5px;}
  .cb-note.cb-pad{padding:0 4px;}
  .cb-missing{color:#B23 !important; font-weight:600;}
  .cb-missing-card{border-color:#E3A3A3; box-shadow:0 0 0 2px #F6DADA;}
  .cb-tabs{display:flex; gap:6px; overflow-x:auto; padding:4px 0 2px;}
  .cb-tab{flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-family:var(--sans); color:var(--ink); cursor:pointer; text-align:left;}
  .cb-tab b{display:block; font-size:14px;}
  .cb-tab small{display:block; font-size:11px; color:var(--ink-soft);}
  .cb-tab.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .cb-tab.on small{color:#B9C3DD;}
  .cb-link{border:none; background:none; color:var(--navy); font:600 13px var(--sans); text-decoration:underline; padding:6px 2px; cursor:pointer;}
  .cb-gridwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.cb-grid{border-collapse:separate; border-spacing:3px; width:100%;}
  table.cb-grid th{font-size:11.5px; color:var(--ink-soft); font-weight:700; text-align:center; padding:2px; white-space:nowrap;}
  table.cb-grid tbody th{text-align:right; padding-right:6px;}
  table.cb-grid td{padding:0; height:34px; min-width:32px;}
  table.cb-grid td.na{background:#F5F6F8; border-radius:7px;}
  .cb-cell{display:block; width:100%; height:34px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; font:600 13px var(--sans); color:var(--ink); padding:0;}
  .cb-cell:hover{border-color:#9AA3AF;}
  .cb-cell.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  table.cb-ghah td{height:40px;} table.cb-ghah .cb-cell{height:40px;}
  .cb-summary{margin-top:12px; padding:10px 12px; background:#F4F8EE; border:1px solid #D6E8BE; border-radius:10px; font-size:13.5px;}
  .cb-summary b{display:block; color:var(--ink);}
  .cb-ref{display:block; font:12px var(--mono); color:var(--ink-soft); margin-top:2px;}
  .cb-warn{display:block; font-size:12.5px; color:var(--amber); margin-top:6px;}
  p.cb-warn{background:#FFF6E8; border:1px solid #F1D3A3; border-radius:8px; padding:8px 10px; margin:8px 0 0;}
  .cb-sec{display:block; width:100%; text-align:left; border:none; border-top:1px solid var(--line); background:none; padding:10px 2px; font:700 13px var(--sans); color:var(--navy); cursor:pointer;}
  .cb-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line);}
  .cb-row:last-child{border-bottom:none;}
  .cb-row .t{flex:1; min-width:0;}
  .cb-row .t b{display:block; font-size:13.5px; font-weight:600;}
  .cb-row .t small{font:11.5px var(--mono); color:var(--ink-soft);}
  .cb-row.on .t b{color:var(--navy);}
  .cb-step{display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:0 0 auto;}
  .cb-step button{width:36px; height:34px; border:none; background:#F4F6F9; font:700 17px var(--sans); color:var(--navy); cursor:pointer;}
  .cb-step button:disabled{color:#C3CAD3; cursor:default;}
  .cb-step span{min-width:30px; text-align:center; font-weight:700; font-size:14px;}
  .cb-row.on .cb-step span{color:var(--green-deep);}
  .cb-foot{position:sticky; bottom:0; margin:14px -16px 0; padding:12px 16px 18px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(0,0,0,.06); display:flex; gap:10px; align-items:center;}
  .cb-add{flex:1; background:var(--green); color:var(--navy-deep); border:none; border-radius:12px; padding:14px; font:800 15.5px var(--sans); cursor:pointer;}
  .cb-add.wait{background:#E4E8EE; color:var(--ink-soft); font-weight:700;}
  .cb-cancel{border:none; background:none; color:var(--ink-soft); font:600 14px var(--sans); padding:12px 6px; cursor:pointer;}
  @media (max-width:480px){
    .modal-overlay{padding:8px;}
    .cb-wrap{padding:12px 12px 0;}
    .cb-foot{margin:14px -12px 0;}
    .cb-odo{gap:2px;}
    .cb-tooth{font-size:9.5px; padding:7px 0; border-radius:4px;}
    .cb-card{padding:12px;}
  }

  /* ---- Treatment plan summary (order panel) ---- */
  .treatment-plan-card{
    background:#EAF4DC; border:1px solid #C9E0A5; border-radius:10px; padding:12px 14px; margin-bottom:14px;
    font-size:12px; color:#3E6310; line-height:1.5;
  }
  .treatment-plan-card .tp-title{font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;}
  .treatment-plan-card .tp-clear{background:none; border:none; color:#3E6310; text-decoration:underline; font-size:11px; cursor:pointer; padding:0;}
  .order-row .tooth-tag{
    display:inline-block; background:#EAF4DC; color:#4F8A16; border-radius:5px; padding:1px 6px;
    font-size:10px; font-weight:700; margin-left:6px; font-family:var(--sans);
  }

  /* ---- System switcher ---- */
  .systembar{
    grid-column:1/-1;
    background:var(--navy-deep);
    display:flex;
    gap:8px;
    padding:10px 28px;
    overflow-x:auto;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .systembar button.sysbtn{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    background:rgba(255,255,255,.05);
    border:1.5px solid rgba(255,255,255,.1);
    color:#B9C3DD;
    border-radius:9px;
    padding:8px 16px;
    cursor:pointer;
    font-family:var(--sans);
    transition:all .12s;
    white-space:nowrap;
  }
  .systembar button.sysbtn .sysname{font-size:12.5px; font-weight:700;}
  .systembar button.sysbtn:hover{border-color:var(--green); color:#fff;}
  .systembar button.sysbtn.active{
    background:var(--green);
    border-color:var(--green);
    color:#0E2B00;
  }
  .systembar button.sysbtn.active .sysname{color:#0E2B00;}

  /* ---- Sidebar (categories) ---- */
  .sidebar{
    background:var(--navy);
    padding:18px 0;
    overflow-y:auto;
  }
  .sidebar .sidebar-section{
    padding:14px 18px 6px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--green);
    opacity:.85;
  }
  .sidebar .sidebar-section:not(:first-child){
    margin-top:6px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .sidebar button.catbtn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#C4CEE6;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:11px 18px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .12s, color .12s;
  }
  .sidebar button.catbtn:hover{background:rgba(255,255,255,.06); color:#fff;}
  .sidebar button.catbtn.active{
    background:rgba(120,190,33,.14);
    color:#fff;
    border-left-color:var(--green);
  }

  /* ---- Main content ---- */
  .content{
    padding:26px 30px 60px;
    overflow-y:auto;
  }
  .content h2{
    margin:0 0 4px;
    font-size:22px;
    color:var(--navy);
    letter-spacing:-.01em;
  }
  .content .subtitle{
    margin:0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .searchwrap{margin-bottom:20px;}
  .searchwrap input{
    width:100%;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13px;
    font-family:var(--sans);
    background:#fff;
  }
  .searchwrap input:focus{outline:2px solid var(--green); border-color:var(--green);}

  .group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .group-head{
    padding:11px 16px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:.01em;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .group-head .headleft{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .group-source{
    padding:4px 16px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    font-size:10.5px;
    color:#6B7280;
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
  }
  .group-source .unverified{
    color:#7A4A0E;
    font-weight:700;
  }
  .group-head .headright{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .group-head .material{
    font-size:10px;
    font-weight:700;
    color:var(--green-deep);
    background:#EEF7E1;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .group-body{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:12px 14px;
  }
  .itembtn-wrap{
    position:relative;
    min-width:150px;
  }
  .itembtn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
    width:100%;
    min-width:150px;
    padding:9px 12px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-family:var(--sans);
    text-align:left;
    transition:border-color .12s, background .12s, transform .06s;
  }
  .itembtn:hover{border-color:var(--navy); transform:translateY(-1px);}
  .itembtn .desc{font-size:12px; font-weight:600; color:var(--ink);}
  .itembtn .ref{font-size:10.5px; font-family:var(--mono); color:var(--ink-soft);}
  .itembtn.selected{
    background:var(--green);
    border-color:var(--green-deep);
  }
  .itembtn.selected .desc{color:#0E2B00;}
  .itembtn.selected .ref{color:#274600;}
  .itembtn .qtytag{
    align-self:flex-end;
    font-size:10px;
    font-weight:700;
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    padding:1px 7px;
    margin-top:2px;
  }
  .allonx-wizard-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:14px 18px;
    margin-bottom:14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    font-family:var(--sans);
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,32,91,.25);
    transition:transform .1s, box-shadow .1s;
  }
  .allonx-wizard-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 16px rgba(0,32,91,.32);
    background:linear-gradient(135deg,var(--navy) 0%,var(--green-deep) 140%);
  }
  .mismatch-banner{
    background:#FDF2E9;
    border:1.5px solid #E8A23D;
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 12px;
    font-size:11.5px;
    color:#7A4A0E;
    line-height:1.5;
  }
  .mismatch-banner .mismatch-title{
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:4px;
  }
  .mismatch-banner ul{margin:0; padding-left:18px;}
  .pending-badge{
    display:inline-block;
    background:#FDF2E9;
    border:1px solid #E8A23D;
    color:#7A4A0E;
    border-radius:5px;
    padding:2px 7px;
    font-size:10px;
    font-weight:700;
    margin-left:8px;
    white-space:nowrap;
  }
  /* Small "i" info badge for a per-group heads-up (e.g. a length or
     sourcing caveat) that doesn't rise to the level of a regulatory
     pending-badge. Hover/focus reveals the detail via native tooltip
     instead of the caveat living permanently in the label text. */
  .note-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#EAF1FB;
    border:1px solid #B7CCEC;
    color:#2C5AA0;
    font-size:10px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    flex:0 0 auto;
  }
  /* Same "i" treatment, sized for the dark topbar next to pageMeta. */
  .meta-note{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    font-style:italic;
    font-family:Georgia,'Times New Roman',serif;
    cursor:help;
    margin-left:6px;
    flex:0 0 auto;
    vertical-align:middle;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,20,56,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:22px;
    max-width:400px;
    width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    position:relative;
  }
  .modal-box h3{
    margin:0 0 8px;
    color:var(--navy);
    font-size:16px;
    font-weight:700;
  }
  .modal-box p{
    margin:0 0 16px;
    color:var(--ink);
    font-size:13px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .modal-box input[type=number]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:16px;
    margin-bottom:18px;
    font-family:var(--sans);
  }
  .modal-box input[type=number]:focus{outline:2px solid var(--green); border-color:var(--green);}
  .modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .modal-actions button{
    padding:11px 20px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    font-family:var(--sans);
  }
  .modal-btn-cancel{background:#EEF0F3; color:var(--ink);}
  .modal-btn-back{background:#fff; border:1.5px solid var(--line); color:var(--navy); margin-right:auto;}
  .modal-btn-back:hover{border-color:var(--navy);}
  .modal-btn-cancel:hover{background:#E2E5EA;}
  .modal-btn-ok{background:var(--green); color:#0E2B00;}
  .modal-btn-ok:hover{background:var(--green-deep); color:#fff;}
  .modal-box.modal-wide{max-width:480px;}
  .modal-options{
    max-height:min(50vh, 420px);
    overflow-y:auto;
    margin-bottom:16px;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .modal-select-row{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;
    border:none;
    border-bottom:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-family:var(--sans);
  }
  .modal-select-row:last-child{border-bottom:none;}
  .modal-select-row:hover{background:#EEF7E1;}
  .modal-select-row .msr-label{font-size:13px; font-weight:600; color:var(--ink); display:block;}
  .modal-select-row .msr-sub{font-size:11px; color:var(--ink-soft); font-family:var(--mono); display:block; margin-top:2px;}
  .no-results{
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 0;
    text-align:center;
  }

  /* ---- Order panel ---- */
  .orderpanel{
    background:#fff;
    border-left:1px solid var(--line);
    padding:20px 20px 24px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .orderpanel-footnote{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    padding-top:10px;
    margin-top:6px;
    border-top:1px solid var(--line);
    flex:0 0 auto;
  }
  .orderpanel h3{
    margin:0 0 2px;
    font-size:15px;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .orderpanel h3 .badge{
    background:var(--navy);
    color:#fff;
    font-size:11px;
    padding:2px 9px;
    border-radius:20px;
    font-family:var(--mono);
  }
  .orderpanel .hint{font-size:11.5px; color:var(--ink-soft); margin:2px 0 14px;}
  .orderlist{
    flex:1;
    overflow-y:auto;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .empty-order{
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
    padding:50px 10px;
    line-height:1.6;
  }
  .order-row{
    display:flex;
    gap:8px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
  }
  .order-row .info{flex:1; min-width:0;}
  .order-row .info .nm{font-size:12px; font-weight:600; color:var(--ink); line-height:1.3;}
  .order-row .info .rf{font-size:10.5px; font-family:var(--mono); color:var(--ink-soft);}
  .order-row input.qty{
    width:44px;
    padding:4px 4px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:5px;
    font-family:var(--mono);
    font-size:12px;
  }
  .order-row .rm{
    background:none; border:none; color:#C0392B; font-size:16px; cursor:pointer; line-height:1;
    padding:2px 4px;
  }
  .out-block{
    margin-top:14px;
  }
  textarea#outputText{
    width:100%;
    height:220px;
    background:#FCFCFA;
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', var(--sans);
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    resize:vertical;
    line-height:1.6;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.04);
  }
  .out-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .out-toggle input{position:absolute; opacity:0; width:1px; height:1px;}
  .out-toggle .switch{
    position:relative;
    width:32px;
    height:18px;
    border-radius:9px;
    background:#C9CED8;
    transition:background .15s;
    flex:0 0 auto;
  }
  .out-toggle .switch::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .15s;
  }
  .out-toggle input:checked + .switch{background:var(--green);}
  .out-toggle input:checked + .switch::after{transform:translateX(14px);}
  .out-toggle input:focus-visible + .switch{outline:2px solid var(--green); outline-offset:2px;}
  textarea#outputText:focus{outline:2px solid var(--green); border-color:var(--green);}
  .copybtn{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:var(--green);
    color:#0E2B00;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s;
  }
  .copybtn:hover{background:var(--green-deep); color:#fff;}
  .clearbtn{
    width:100%;
    margin-top:8px;
    padding:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  .clearbtn:hover{border-color:#C0392B; color:#C0392B;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep);
    color:#fff;
    padding:10px 22px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:all .25s;
    border:1px solid var(--green);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:980px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:flex; overflow-x:auto; padding:10px;}
    .sidebar button.catbtn{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .sidebar button.catbtn.active{border-left:none; border-bottom-color:var(--green);}
    .orderpanel{position:relative; height:auto;}
    .searchwrap input{font-size:16px;} /* iOS Safari auto-zooms on focus below 16px */
  }
</style>
</head>
<body>
<div class="app" id="appRoot">
  <div class="topbar">
    <div class="brand" style="display:flex; align-items:center;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span class="eyebrow">Implant Reference</span>
        <h1 id="pageTitle">Implant Parts Selector</h1>
      </div>
    </div>
    <div class="topbar-right">
      <div class="meta" id="pageMeta"></div>
      <button class="homebtn" id="homeBtn" title="Home" aria-label="Home">⌂</button>
    </div>
  </div>

  <div id="homeView"></div>

  <div id="builderView"></div>

  <div class="systembar" id="systembar"></div>

  <div class="sidebar" id="sidebar"></div>

  <div class="content" id="content">
    <div class="searchwrap">
      <input type="text" id="searchBox" placeholder="Search this system's components (e.g. &quot;3.75&quot;, &quot;cover screw&quot;, &quot;healing abutment&quot;, REF number)…">
    </div>
    <div id="categoryView"></div>
  </div>

  <div class="orderpanel">
    <h3>Order List <span class="badge" id="orderCount">0</span></h3>
    <div class="hint">Tap a component to add it, set quantity, then copy into your note.</div>
    <div class="orderlist" id="orderList">
      <div class="empty-order">No items selected yet.<br>Choose components from the catalog to build your order.</div>
    </div>
    <div class="out-block">
      <label class="out-toggle">
        <input type="checkbox" id="catalogPagesToggle" onchange="setShowCatalogPages(this.checked)">
        <span class="switch" aria-hidden="true"></span>
        <span>Include catalog pages</span>
      </label>
      <textarea id="outputText" readonly>No items selected.</textarea>
      <button class="copybtn" onclick="copyText()">📋 Copy Order to Clipboard</button>
      <button class="clearbtn" onclick="clearAll()">Clear all selections</button>
    </div>
    <div class="orderpanel-footnote">Verify all part numbers before ordering</div>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script src="catalog/common.js"></script>
<script src="catalog/straumann-blc-blx.js"></script>
<script src="catalog/straumann-blt.js"></script>
<script src="catalog/nobel-conical.js"></script>
<script src="catalog/nobel-s-series.js"></script>
<script src="catalog/nobel-zygoma.js"></script>
<script src="catalog/neodent-gm.js"></script>
<script src="catalog/systems.js"></script>
<script src="compatibility.js"></script>
<script src="diagrams.js"></script>
<script src="case-builder.js"></script>
<script>

function sectionOf(sys, cat){ return sys.surgical.has(cat) ? "SURGICAL" : "PROSTHETIC / RESTORATIVE"; }

/* ---------- State ---------- */
let activeSystemId = "blc";
let activeCategory = SYSTEMS[activeSystemId].order[0];
let viewMode = "home";  // "home" | "category" | "builder" — Home is the default landing screen
let selected = {};   // key `${systemId}::${ref}` -> {name, group, category, qty, system, ref}

/* ---------- System switcher ---------- */
function buildSystemBar(){
  const bar = document.getElementById('systembar');
  bar.innerHTML = '';

  SYSTEM_IDS.forEach(id=>{
    const sys = SYSTEMS[id];
    const btn = document.createElement('button');
    btn.className = 'sysbtn' + (id===activeSystemId && viewMode==='category' ? ' active':'');
    btn.innerHTML = `<span class="sysname">${sys.name}</span>`;
    btn.onclick = ()=>{
      navigateWithFade(()=>{
        activeSystemId = id;
        activeCategory = SYSTEMS[id].order[0];
        viewMode = "category";
        document.getElementById('searchBox').value = '';
        render();
      });
    };
    bar.appendChild(btn);
  });

  const metaEl = document.getElementById('pageMeta');
  metaEl.innerHTML = '';
  const sys = SYSTEMS[activeSystemId];
  metaEl.appendChild(document.createTextNode(sys.fullMeta));
  if(sys.caveat){
    const nb = document.createElement('span');
    nb.className = 'meta-note';
    nb.textContent = 'i';
    nb.title = sys.caveat;
    metaEl.appendChild(nb);
  }
}

/* ---------- Build sidebar: the active system's categories ---------- */
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  const sys = SYSTEMS[activeSystemId];
  let lastSection = null;
  sys.order.forEach(cat=>{
    const section = sectionOf(sys, cat);
    if(section !== lastSection){
      const div = document.createElement('div');
      div.className = 'sidebar-section';
      div.textContent = section;
      sb.appendChild(div);
      lastSection = section;
    }
    const btn = document.createElement('button');
    btn.className = 'catbtn' + (cat===activeCategory ? ' active':'');
    btn.innerHTML = `<span>${cat}</span>`;
    btn.onclick = ()=>{ activeCategory = cat; viewMode = 'category'; document.getElementById('searchBox').value=''; render(); };
    sb.appendChild(btn);
  });
}

/* Renders one item as an add-to-order card. */
function renderItemCard(container, systemId, name, ref, groupLabel, category){
  const key = systemId+'::'+ref;
  const wrap = document.createElement('div');
  wrap.className = 'itembtn-wrap';

  const isSel = !!selected[key];
  const btn = document.createElement('button');
  btn.className = 'itembtn' + (isSel ? ' selected':'');
  btn.innerHTML = `<span class="desc">${name}</span><span class="ref">REF ${ref}</span>` +
                   (isSel ? `<span class="qtytag">Qty ${selected[key].qty}</span>` : '');
  btn.onclick = ()=> toggleItem(systemId, ref, name, groupLabel, category);
  wrap.appendChild(btn);

  container.appendChild(wrap);
}

function renderGroupHead(container, systemId, category, group, labelPrefix){
  const headEl = document.createElement('div');
  headEl.className = 'group-head';

  const left = document.createElement('div');
  left.className = 'headleft';
  const labelSpan = document.createElement('span');
  labelSpan.textContent = labelPrefix ? `${labelPrefix} — ${group.label}` : group.label;
  left.appendChild(labelSpan);
  if(group.pendingNote){
    const badge = document.createElement('span');
    badge.className = 'pending-badge';
    badge.textContent = '⏳ Not yet available for sale';
    badge.title = group.pendingNote;
    left.appendChild(badge);
  }
  if(group.note){
    const nb = document.createElement('span');
    nb.className = 'note-badge';
    nb.textContent = 'i';
    nb.title = group.note;
    left.appendChild(nb);
  }
  headEl.appendChild(left);

  const right = document.createElement('div');
  right.className = 'headright';
  if(group.material){
    const mat = document.createElement('span');
    mat.className = 'material';
    mat.textContent = group.material;
    right.appendChild(mat);
  }
  headEl.appendChild(right);

  container.appendChild(headEl);

  // Where the article numbers come from, so whoever orders can check the
  // catalog page. Hover shows the full catalog title.
  if(group.source || group.unverified){
    const src = document.createElement('div');
    src.className = 'group-source';
    if(group.source){
      const s = document.createElement('span');
      s.textContent = 'Source: ' + group.source;
      s.title = Object.keys(CATALOG_SOURCES).filter(k=>group.source.includes(k)).map(k=>CATALOG_SOURCES[k]).join('\n');
      src.appendChild(s);
    }
    if(group.unverified){
      const u = document.createElement('span');
      u.className = 'unverified';
      u.textContent = '⚠ ' + group.unverified + ' — confirm before ordering';
      src.appendChild(u);
    }
    container.appendChild(src);
  }
}

/* ---------- Render category / search view ---------- */
const ICON_IMPLANT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3.6c0-1.1 1.6-2 3.5-2s3.5.9 3.5 2-1.6 2-3.5 2-3.5-.9-3.5-2z"/><line x1="12" y1="5.6" x2="12" y2="8"/><path d="M9 8h6l-1 10.3-2 3.1-2-3.1z"/><line x1="9.3" y1="10" x2="14.7" y2="10"/><line x1="9.5" y1="12" x2="14.5" y2="12"/><line x1="9.7" y1="14" x2="14.3" y2="14"/><line x1="10" y1="16" x2="14" y2="16"/></svg>`;
const ICON_ARCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.2c0 5.9 4 10.3 9 10.3s9-4.4 9-10.3"/><path d="M4.3 7c2.3 1.9 4.9 2.9 7.7 2.9S17.4 8.9 19.7 7"/><line x1="7.1" y1="9.5" x2="7.7" y2="12.4"/><line x1="10.5" y1="10.7" x2="10.7" y2="13.6"/><line x1="13.5" y1="10.7" x2="13.3" y2="13.6"/><line x1="16.9" y1="9.5" x2="16.3" y2="12.4"/></svg>`;
const ICON_BOOK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8c-1.7-1.3-3.8-1.9-5.9-1.9-.7 0-1.3.6-1.3 1.3v11c0 .7.6 1.3 1.3 1.3 2.1 0 4.2.6 5.9 1.9 1.7-1.3 3.8-1.9 5.9-1.9.7 0 1.3-.6 1.3-1.3v-11c0-.7-.6-1.3-1.3-1.3-2.1 0-4.2.6-5.9 1.9z"/><line x1="12" y1="6.8" x2="12" y2="19.4"/></svg>`;

/* Fades the current view out, runs the navigation, then fades the new view
   in — used for every top-level navigation (Home, system tabs and the
   three Home-screen buttons) so switching views reads
   as a deliberate transition rather than an instant content swap. */
function navigateWithFade(fn){
  const app = document.getElementById('appRoot');
  app.classList.add('nav-fade');
  setTimeout(()=>{
    fn();
    const raf = window.requestAnimationFrame || (cb => setTimeout(cb, 16));
    raf(()=> app.classList.remove('nav-fade'));
  }, 140);
}

let currentTreatmentPlan = null; // {type:'single'|'bridge', implants:[...], pontics:[...]} — shown atop the order panel

function goToFullCatalog(){
  navigateWithFade(()=>{
    viewMode = 'category';
    render();
  });
}

function renderHomeView(){
  const el = document.getElementById('homeView');
  el.innerHTML = `
    <div class="home-card-outer">
      <div class="home-hero">
        <div class="art">${ICON_IMPLANT}</div>
        <div class="txt">
          <p class="eyebrow">Implant Reference</p>
          <h2>Implant Parts Selector</h2>
        </div>
      </div>
      <div class="home-btn-row">
        <button class="home-card" id="homeCardWizard" type="button">
          <div class="hc-icon">${ICON_IMPLANT}</div>
          <div class="hc-txt"><h3>Single Implant / Bridge Wizard</h3></div>
          <div class="hc-arrow">&rsaquo;</div>
        </button>
        <button class="home-card" id="homeCardAllOnX" type="button">
          <div class="hc-icon">${ICON_ARCH}</div>
          <div class="hc-txt"><h3>All-on-X Wizard</h3></div>
          <div class="hc-arrow">&rsaquo;</div>
        </button>
        <button class="home-card" id="homeCardCatalog" type="button">
          <div class="hc-icon">${ICON_BOOK}</div>
          <div class="hc-txt"><h3>Full Catalog</h3></div>
          <div class="hc-arrow">&rsaquo;</div>
        </button>
      </div>
    </div>
  `;
  document.getElementById('homeCardWizard').onclick = ()=> openCaseBuilder({kind:'case'});
  document.getElementById('homeCardAllOnX').onclick = ()=> openCaseBuilder({kind:'allonx'});
  document.getElementById('homeCardCatalog').onclick = goToFullCatalog;
}

function render(){
  const appRoot = document.getElementById('appRoot');
  appRoot.classList.toggle('home-mode', viewMode==='home');
  appRoot.classList.toggle('builder-mode', viewMode==='builder');
  document.getElementById('homeBtn').style.display = viewMode==='home' ? 'none' : 'flex';
  if(viewMode==='home'){ document.getElementById('pageMeta').innerHTML = ''; renderHomeView(); return; }
  if(viewMode==='builder'){ document.getElementById('pageMeta').innerHTML = ''; renderCaseBuilder(); return; }

  buildSystemBar();
  buildSidebar();

  const sys = SYSTEMS[activeSystemId];
  const container = document.getElementById('categoryView');
  container.innerHTML = '';

  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  const heading = document.createElement('div');
  if(query){
    heading.innerHTML = `<h2>Search results</h2><p class="subtitle">Matching "${escapeHtml(query)}" within ${sys.name}</p>`;
  } else {
    const allOnXNote = activeCategory === "All-on-X Components"
      ? ' — components already listed elsewhere in this catalog, grouped here for full-arch treatment planning'
      : '';
    heading.innerHTML = `<h2>${activeCategory}</h2><p class="subtitle">${sys.name} — tap a component to add it to your order${allOnXNote}</p>`;
  }
  container.appendChild(heading);

  if(!query && activeCategory === "All-on-X Components"){
    const wizardBtn = document.createElement('button');
    wizardBtn.className = 'allonx-wizard-btn';
    wizardBtn.innerHTML = '🦷 Start an All-on-X case';
    wizardBtn.onclick = ()=> openCaseBuilder({kind:'allonx', sys:activeSystemId});
    container.appendChild(wizardBtn);
  }

  if(!query){
    const kinds = diagramKindsToOffer(sys.catalog[activeCategory].flatMap(g=>diagramKindsFor(activeSystemId, g.sourceCategory || activeCategory, g)));
    if(kinds.length) container.appendChild(buildDiagramToggles(kinds));
  }

  let anyResults = false;

  sys.order.forEach(cat=>{
    if(!query && cat!==activeCategory) return;
    sys.catalog[cat].forEach(group=>{
      let matchingItems = group.items.filter(([name,ref])=>{
        if(!query) return true;
        return (name.toLowerCase().includes(query) || ref.toLowerCase().includes(query) ||
                group.label.toLowerCase().includes(query) || cat.toLowerCase().includes(query));
      });
      if(matchingItems.length===0) return;
      anyResults = true;

      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      renderGroupHead(groupEl, activeSystemId, cat, group, group.sourceCategory || (query ? cat : null));

      const bodyEl = document.createElement('div');
      bodyEl.className = 'group-body';
      matchingItems.forEach(([name,ref])=>{
        renderItemCard(bodyEl, activeSystemId, name, ref, group.label, cat);
      });
      groupEl.appendChild(bodyEl);
      container.appendChild(groupEl);
    });
  });

  if(!anyResults){
    const p = document.createElement('div');
    p.className = 'no-results';
    p.textContent = 'No matching components found in this system.';
    container.appendChild(p);
  }
}

/* "ⓘ What do GH and AH mean?" buttons under a category heading, one per
   kind of drawing its groups use; tapping one shows that drawing below,
   tapping it again hides it. */
function buildDiagramToggles(kinds){
  const wrap = document.createElement('div');
  wrap.className = 'dg-toggles';
  const row = document.createElement('div');
  row.className = 'dg-row';
  const panel = document.createElement('div');
  let open = null;
  kinds.forEach(kind=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dg-btn';
    btn.textContent = 'ⓘ ' + DIAGRAM_BUTTON_LABELS[kind];
    btn.onclick = ()=>{
      open = open===kind ? null : kind;
      row.querySelectorAll('.dg-btn').forEach(b=>b.classList.toggle('on', b===btn && open===kind));
      panel.innerHTML = open ? diagramHtml(open) : '';
    };
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  wrap.appendChild(panel);
  return wrap;
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- Selection logic ---------- */
/* A "caution" on a catalog group (see e.g. the BLC Ø4.5mm implants, and
   FOLLOW-UP.md for the full list) means the data itself is a genuine open
   question, not a UI nice-to-have — so every path that can add an item
   from that group (manual catalog tap or the case builder)
   routes through this same confirm gate rather than each needing its
   own copy of the warning. Returns true if there's nothing to confirm,
   or if the person confirms; false means "don't add, go back." */
async function confirmGroupCaution(systemId, category, groupLabel){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  if(!group || !group.caution) return true;
  return await showModal({
    type:'confirm', title:'Please confirm before adding',
    message: group.caution,
    okText:'Add anyway', cancelText:'Go back'
  });
}

async function toggleItem(systemId, ref, name, groupLabel, category){
  const key = systemId+'::'+ref;
  if(selected[key]){
    delete selected[key];
    render();
    renderOrder();
    return;
  }
  if(!(await confirmGroupCaution(systemId, category, groupLabel))) return;
  const packSize = parsePackSize(name, groupLabel);
  const packNote = packSize>1 ? `\n\nThis item ships ${packSize} per package. The number below is packages, not individual pieces.` : '';
  let qty = await showModal({type:'prompt', title:'Quantity', message:`${name}\n(${groupLabel})${packNote}`, defaultValue:'1', okText:'Add'});
  if(qty === null) return;
  qty = parseInt(qty,10);
  if(!qty || qty < 1) qty = 1;
  selected[key] = {name, group:groupLabel, category, qty, system:systemId, ref};
  render();
  renderOrder();

  await maybeOfferPartsForImplant(systemId, groupLabel, category, name, ref, qty);
  await maybeOfferMultiUnitCap(systemId, category, groupLabel);
}

/* After an implant is added straight from the catalog, offers the case
   builder for its parts, with the implant already filled in. */
async function maybeOfferPartsForImplant(systemId, groupLabel, category, name, ref, qty){
  if(WIZARD_IMPLANTS_CATEGORY_NAME[systemId] !== category) return;
  if(!(WIZARD_CONFIG[systemId] || []).length) return;
  const wants = await showModal({
    type:'confirm', title:'Add parts for this implant?',
    message:'Pick its cover screw, healing abutment and other parts on one screen.',
    okText:'Yes, pick parts', cancelText:'No, skip'
  });
  if(wants) openCaseBuilder({sys:systemId, fixedImplant:{group:groupLabel, name, ref, qty}});
}

function updateQty(key, val){
  let q = parseInt(val,10);
  if(!q || q<1) q = 1;
  if(selected[key]) selected[key].qty = q;
  renderOrder(false);
}

function removeItem(key){
  delete selected[key];
  render();
  renderOrder();
}

async function clearAll(){
  if(Object.keys(selected).length===0) return;
  const ok = await showModal({type:'confirm', title:'Clear order?', message:'Clear all selected items across all systems?', okText:'Clear'});
  if(ok){
    selected = {};
    currentTreatmentPlan = null;
    render();
    renderOrder();
  }
}

/* ---------- Order panel ---------- */
async function maybeOfferMultiUnitCap(systemId, category, groupLabel){
  const trigger = MULTI_UNIT_CAP_TRIGGER[systemId];
  if(!trigger) return;
  if(resolveTrueCategory(systemId, category, groupLabel) !== trigger.category) return;
  if(groupLabel === trigger.capGroupLabel) return; // the item just added IS a cap

  const wants = await showModal({
    type:'confirm', title:`Add a ${trigger.capLabel}?`,
    message:`Want to add a ${trigger.capLabel.toLowerCase()} for this multi-unit abutment?`,
    okText:'Yes, add one', cancelText:'No, skip'
  });
  if(!wants) return;

  const added = await pickFromFilteredGroup(systemId, trigger.category, trigger.capGroupLabel, trigger.capNameFilter, trigger.capLabel, 1);
  if(added) showToast(`Added ${trigger.capLabel.toLowerCase()}`);
}

/* Pick one item from a specific group (optionally name-filtered), then
   quantity — used by the healing-cap prompt above. Adds to the quantity
   if the same item is already in the order. */
async function pickFromFilteredGroup(systemId, category, groupLabel, nameFilter, promptLabel, defaultQty){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  let items = group ? group.items : [];
  if(nameFilter) items = items.filter(([nm])=>nm.includes(nameFilter));
  if(!group || items.length===0){
    await showModal({type:'alert', title:promptLabel, message:`No ${promptLabel.toLowerCase()} options found.`});
    return null;
  }
  if(group.caution && !(await confirmGroupCaution(systemId, group.sourceCategory || category, group.label))) return null;

  while(true){
    const choice = await showModal({
      type:'select', title:promptLabel, message:'Which one?',
      options: items.map(([nm,rf],i)=>({value:i, label:nm, sublabel:'REF '+rf}))
    });
    if(choice===null) return null;
    const chosenItem = items[choice];

    const packSize = parsePackSize(chosenItem[0], group.label);
    const piecesNeeded = defaultQty||1;
    const suggestedPackages = packSize>1 ? Math.max(1, Math.ceil(piecesNeeded/packSize)) : piecesNeeded;
    const packNote = packSize>1
      ? `\n\nThis item ships ${packSize} per package. You need ${piecesNeeded} piece${piecesNeeded===1?'':'s'} — enter the number of PACKAGES (suggested: ${suggestedPackages}).`
      : '';
    const qty = await showModal({
      type:'prompt', title: packSize>1 ? 'Quantity (packages)' : 'Quantity', message:`${chosenItem[0]}\n(${group.label})${packNote}`,
      defaultValue:String(suggestedPackages||1), okText:'Add', showBack:true
    });
    if(qty==='__WIZARD_BACK__') continue; // back to the item list
    if(qty===null) return null;
    const finalQty = parseInt(qty,10) || 1; // packages actually ordered

    const key = systemId+'::'+chosenItem[1];
    const existingQty = selected[key] ? selected[key].qty : 0;
    const existingTeeth = selected[key] ? selected[key].teeth : undefined;
    selected[key] = {name:chosenItem[0], group:group.label, category, qty: existingQty + finalQty, system:systemId, ref:chosenItem[1]};
    if(existingTeeth) selected[key].teeth = existingTeeth;
    render();
    renderOrder();
    return finalQty;
  }
}

function renderOrder(){
  const list = document.getElementById('orderList');
  const keys = Object.keys(selected);
  document.getElementById('orderCount').textContent = keys.length;

  list.innerHTML = '';

  if(currentTreatmentPlan){
    const tp = currentTreatmentPlan;
    const parts = [];
    if(tp.implants.length) parts.push(`<b>Implant:</b> #${tp.implants.join(', #')}`);
    if(tp.pontics.length) parts.push(`<b>Pontic:</b> #${tp.pontics.join(', #')}`);
    const card = document.createElement('div');
    card.className = 'treatment-plan-card';
    card.innerHTML = `<div class="tp-title"><span>${tp.type==='bridge' ? 'Bridge Treatment Plan' : 'Single Implant Crown(s) Treatment Plan'}</span>` +
      `<button class="tp-clear" onclick="clearTreatmentPlan()">Clear</button></div>${parts.join(' &nbsp;·&nbsp; ')}`;
    list.appendChild(card);
  }

  if(keys.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty-order';
    empty.innerHTML = 'No items selected yet.<br>Choose components from the catalog to build your order.';
    list.appendChild(empty);
  } else {
    const mismatches = detectPlatformMismatches(selected);
    if(mismatches.length>0){
      const banner = document.createElement('div');
      banner.className = 'mismatch-banner';
      banner.innerHTML = `<div class="mismatch-title">⚠ Possible platform mismatch</div>` +
        `<ul>${mismatches.map(w=>`<li>${escapeHtml(formatMismatchLine(w))}</li>`).join('')}</ul>`;
      list.appendChild(banner);
    }

    keys.forEach(key=>{
      const it = selected[key];
      const packSize = parsePackSize(it.name, it.group);
      const packLine = packSize>1
        ? `<div class="rf">${it.qty} package${it.qty===1?'':'s'} × ${packSize}/pkg = ${it.qty*packSize} pieces</div>`
        : '';
      const toothTags = (it.teeth && it.teeth.length)
        ? it.teeth.map(t=>`<span class="tooth-tag">#${t}</span>`).join('')
        : '';
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = `
        <div class="info">
          <div class="nm">${describeItem(it)}${toothTags}</div>
          <div class="rf">REF ${it.ref}</div>
          ${packLine}
        </div>
        <input class="qty" type="number" min="1" value="${it.qty}" onchange="updateQty('${key}', this.value)">
        <button class="rm" title="Remove" onclick="removeItem('${key}')">✕</button>
      `;
      list.appendChild(row);
    });
  }
  updateOutput();
}

function clearTreatmentPlan(){
  currentTreatmentPlan = null;
  renderOrder();
}

/* Builds a self-contained description of an item: enough for someone to
   order it correctly even if they never look up the REF number. Always
   names the implant system so mixed multi-brand orders stay unambiguous. */
function describeItem(it){
  const sys = SYSTEMS[it.system];
  const prefix = sys.prefix[it.category];
  if(prefix){
    return `${prefix}, ${it.group}, ${it.name} length`;
  }
  if(prefix === ''){
    return `${sys.name} — ${it.group}, ${it.name}`;
  }
  return `${sys.name} — ${it.category}: ${it.group}, ${it.name}`;
}

/* "Catalog pages" switch above the order output. Remembered per browser. */
let showCatalogPages = false;
try{ showCatalogPages = localStorage.getItem('showCatalogPages') === '1'; }catch(e){}
function setShowCatalogPages(on){
  showCatalogPages = on;
  try{ localStorage.setItem('showCatalogPages', on ? '1' : '0'); }catch(e){}
  updateOutput();
}

function updateOutput(){
  const keys = Object.keys(selected);
  const ta = document.getElementById('outputText');
  if(keys.length===0){
    ta.value = "No items selected.";
    return;
  }
  const today = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const bySystem = {};
  keys.forEach(key=>{
    const it = selected[key];
    (bySystem[it.system] = bySystem[it.system] || []).push(it);
  });
  const systemsUsed = Object.keys(bySystem);

  let lines = [];
  lines.push(systemsUsed.length>1 ? 'Multi-System Implant Order Request' : `${SYSTEMS[systemsUsed[0]].name} Order Request`);
  lines.push(`Date: ${today}`);
  lines.push('');

  let counter = 0;
  SYSTEM_IDS.forEach(sid=>{
    const items = bySystem[sid];
    if(!items || items.length===0) return;
    if(systemsUsed.length>1){
      lines.push(`── ${SYSTEMS[sid].name} ──`);
      lines.push('');
    }
    items.forEach(it=>{
      counter++;
      lines.push(`${counter}. ${describeItem(it)}`);
      lines.push(`    REF ${it.ref}  ·  Qty: ${it.qty}`);
      if(showCatalogPages){
        const c = catalogSourceFor(it);
        lines.push(c.source ? `    Catalog: ${c.source}` : `    Catalog: not verified — ${c.unverified}`);
      }
      lines.push('');
    });
  });
  lines.push(`Total line items: ${keys.length}`);
  ta.value = lines.join('\n');
}

async function copyText(){
  const mismatches = detectPlatformMismatches(selected);
  if(mismatches.length>0){
    const msg = "Possible platform mismatch detected:\n\n" +
      mismatches.map(w=>"• " + formatMismatchLine(w)).join("\n") +
      "\n\nThis can be intentional (e.g. different sites needing different platforms) — just double-check before ordering.";
    const ok = await showModal({type:'confirm', title:'⚠ Check before copying', message:msg, okText:'Copy anyway', cancelText:'Go back'});
    if(!ok) return;
  }
  const ta = document.getElementById('outputText');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    showToast('Order copied to clipboard');
  }).catch(()=>{
    document.execCommand('copy');
    showToast('Order copied to clipboard');
  });
}

/* Custom in-app modal — replaces window.prompt/confirm/alert, which many
   sandboxed mobile webviews (including how artifacts render in the Claude
   mobile app) silently block or no-op. Returns a Promise: prompt resolves
   with the entered string (or null if cancelled), confirm resolves with
   true/false, alert resolves with true once dismissed. */
function showModal(opts){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box' + (opts.type==='select' ? ' modal-wide' : '');

    if(opts.title){
      const h3 = document.createElement('h3');
      h3.textContent = opts.title;
      box.appendChild(h3);
    }
    if(opts.message){
      const p = document.createElement('p');
      p.textContent = opts.message;
      box.appendChild(p);
    }

    function close(result){
      document.body.removeChild(overlay);
      resolve(result);
    }

    let input = null;

    if(opts.type === 'prompt'){
      input = document.createElement('input');
      input.type = 'number';
      input.min = '1';
      input.value = opts.defaultValue || '1';
      box.appendChild(input);
    }

    if(opts.type === 'select'){
      const optWrap = document.createElement('div');
      optWrap.className = 'modal-options';
      opts.options.forEach(o=>{
        const btn = document.createElement('button');
        btn.className = 'modal-select-row';
        btn.innerHTML = `<span class="msr-label">${o.label}</span>` + (o.sublabel ? `<span class="msr-sub">${o.sublabel}</span>` : '');
        btn.onclick = ()=> close(o.value);
        optWrap.appendChild(btn);
      });
      box.appendChild(optWrap);
    }

    const actions = document.createElement('div');
    actions.className = 'modal-actions';

    if(opts.showBack){
      const backBtn = document.createElement('button');
      backBtn.className = 'modal-btn-cancel modal-btn-back';
      backBtn.textContent = '← Back';
      backBtn.onclick = ()=> close('__WIZARD_BACK__');
      actions.appendChild(backBtn);
    }

    if(opts.type !== 'alert' && opts.type !== 'select'){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn-cancel';
      cancelBtn.textContent = opts.cancelText || 'Cancel';
      cancelBtn.onclick = ()=> close(opts.type==='prompt' ? null : false);
      actions.appendChild(cancelBtn);
    } else if(opts.type === 'select'){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn-cancel';
      cancelBtn.textContent = opts.cancelText || 'Cancel';
      cancelBtn.onclick = ()=> close(null);
      actions.appendChild(cancelBtn);
    }

    if(opts.type !== 'select'){
      const okBtn = document.createElement('button');
      okBtn.className = 'modal-btn-ok';
      okBtn.textContent = opts.okText || 'OK';
      okBtn.onclick = ()=>{
        if(opts.type==='prompt') close(input.value || opts.defaultValue || '1');
        else close(true);
      };
      actions.appendChild(okBtn);
    }

    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    if(input){
      input.focus();
      input.select();
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') close(input.value || '1'); });
    } else if(opts.type !== 'select'){
      const okBtn = box.querySelector('.modal-btn-ok');
      if(okBtn) okBtn.focus();
    }
    overlay.addEventListener('click', e=>{
      if(e.target!==overlay) return;
      if(opts.type==='prompt' || opts.type==='select') close(null);
      else close(false);
    });
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ---------- Search wiring ---------- */
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('homeBtn').addEventListener('click', ()=>{
  if(viewMode==='builder'){ cbCancel(); return; }
  navigateWithFade(()=>{ viewMode='home'; render(); });
});
document.getElementById('builderView').addEventListener('click', cbOnClick);

/* ---------- Init ---------- */
document.getElementById('catalogPagesToggle').checked = showCatalogPages;
render();
renderOrder();
