/* Option-level group filters: labelMustInclude / labelMustExclude narrow a
   category down to the groups a wizard step is about. */
function applyOptionLabelFilters(groups, option){
  let out = groups;
  if(option && option.labelMustInclude) out = out.filter(g=>g.label.includes(option.labelMustInclude));
  if(option && option.labelMustExclude) out = out.filter(g=>!g.label.includes(option.labelMustExclude));
  return out;
}

/* A category's groups that hold at least one item fitting the implant(s).
   `implantPlatform` may be a platform string, a Set of platforms, or a full
   implant profile (see toProfile). If nothing fits, the result is empty —
   the caller tells the person so, rather than offering other platforms'
   parts. */
function wizardCandidateGroups(systemId, categoryName, implantPlatform, option, implantGeneration){
  const sys = SYSTEMS[systemId];
  const profile = toProfile(implantPlatform, implantGeneration);
  const groups = applyOptionLabelFilters((sys.catalog[categoryName] || []).slice(), option);
  return groups.filter(g=>wizardCandidateItems(systemId, categoryName, g, g.items, profile).length>0);
}

/* The items in one group that fit the implant(s). Handles platforms
   encoded per item as well as per group (e.g. Nobel's Cover Screws holds
   one group with "3.0 Platform"/"NP"/"RP"/"WP" as four separate items). */
function wizardCandidateItems(systemId, categoryName, group, items, implantPlatform, implantGeneration){
  const profile = toProfile(implantPlatform, implantGeneration);
  return items.filter(([name])=>partFits(systemId, categoryName, group, name, profile));
}

/* Runs one part-type step of the wizard: pick subtype (if >1 option), pick
   diameter/platform variant (the group), pick size/gingival height (the
   item), then quantity — adding the chosen item straight into the order.
   `platformTracker`, if passed a Set, gets the picked item's platform
   added to it (used by the case wizard to remember every implant platform
   selected, so later steps can filter against all of them). */
/* Detects the "GH 1.5 / AH 2mm (3.5mm)" pattern used throughout healing
   abutment items — gingival height (GH, the portion within the soft
   tissue) and abutment height (AH, the portion above the gumline the
   restoration attaches to), with the combined total in parentheses. Only
   items that actually use this two-part naming get the friendlier
   two-question flow below; anything else (implant lengths, cover screw
   names, etc.) falls back to the existing flat list untouched. */
/* Detects "sold N per package" items — e.g. "Protective Caps (4 pack,
   PEEK/TAN)" or "Burn-out Coping (4 pack)" or "(2/pkg)" or "(4 pcs)". The
   pack size can live on the item's own name OR on its parent group's label
   (Straumann's Protective Caps line only states "4 pack" on the group,
   not on each individual item). Returns 1 (no packaging) if nothing matches.
   Used everywhere quantity is asked for or displayed, so a person entering
   "2" for a 4-per-package item is understood as 2 PACKAGES (= 8 pieces),
   not 2 raw pieces — this is what the quantity-remaining math in the
   wizards needs to stay correct. */
function parsePackSize(name, groupLabel){
  const re = /\((\d+)\s*(?:pack|pcs)\b|\((\d+)\/pkg\)/i;
  let m = (name||'').match(re);
  if(!m) m = (groupLabel||'').match(re);
  if(!m) return 1;
  const n = parseInt(m[1]||m[2],10);
  return (n && n>1) ? n : 1;
}

function parseGHAH(name){
  const m = name.match(/GH\s*([\d.]+)\s*\/\s*AH\s*([\d.]+)\s*mm(?:\s*\(([\d.]+)mm\))?/i);
  if(!m) return null;
  return { gh: m[1], ah: m[2], total: m[3] || null };
}
function friendlyItemLabel(name){
  const p = parseGHAH(name);
  if(!p) return name;
  return `Gingival Height ${p.gh}mm, Abutment Height ${p.ah}mm` + (p.total ? ` (Total height: ${p.total}mm)` : '');
}

async function runWizardStep(systemId, step, implantPlatform, defaultQty, stepLabel, platformTracker, canBackFurther, implantGeneration){
  const state = {};
  const history = []; // phases that were actually shown as a choice — Back pops this
  let phase = 'subtype';

  // Pressing Back with no internal history left either does nothing (no
  // previous phase to return to) or escalates out to the caller, which
  // undoes the previous phase and re-runs it — this is what lets Back work
  // seamlessly all the way from a deep GH/AH sub-question back out to
  // "redo Backup Implants," not just within one part's own cascade.
  function handleBack(){
    if(history.length>0){ phase = history.pop(); return null; }
    return canBackFurther ? '__PART_BACK__' : null;
  }

  while(true){
    // --- Subtype (e.g. Regular vs Anatomic) ---
    if(phase === 'subtype'){
      if(step.options.length === 1){
        state.chosenOption = step.options[0];
        phase = 'group';
        continue;
      }
      const choice = await showModal({
        type:'select', progress: stepLabel, title:step.label, message:'Which kind?',
        options: step.options.map((o,i)=>({value:i, label:o.label})),
        showBack: history.length>0 || canBackFurther
      });
      if(choice==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(choice===null) return null;
      state.chosenOption = step.options[choice];
      history.push('subtype');
      phase = 'group';
      continue;
    }

    // --- Diameter / platform variant (the group) ---
    if(phase === 'group'){
      const groups = wizardCandidateGroups(systemId, state.chosenOption.category, implantPlatform, state.chosenOption, implantGeneration);
      if(groups.length===0){
        const prof = toProfile(implantPlatform, implantGeneration);
        const plat = prof.platforms.size ? ` (${platformLabel(prof.platforms)} platform)` : '';
        await showModal({type:'alert', title:step.label, message:`None of the ${state.chosenOption.label.toLowerCase()} options in this catalog fit this implant${plat}. If you need one, order it directly from the manufacturer's catalog or your rep.`});
        return null;
      }
      if(groups.length === 1){
        state.chosenGroup = groups[0];
        phase = 'items';
        continue;
      }
      const choice = await showModal({
        type:'select', progress: stepLabel, title: step.label,
        message: `${state.chosenOption.label} — which diameter / platform variant do you need?`,
        options: groups.map((g,i)=>({value:i, label:g.label, sublabel:g.material||''})),
        showBack: history.length>0 || canBackFurther
      });
      if(choice==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(choice===null) return null;
      state.chosenGroup = groups[choice];
      history.push('group');
      phase = 'items';
      continue;
    }

    // --- Size / gingival height (the item) — split into two plain-language
    //     questions (gingival height, then abutment height) whenever the
    //     catalog names follow the "GH x / AH y" pattern, instead of a
    //     single cryptic flat list. Falls back to the flat list otherwise. ---
    if(phase === 'items'){
      if(state.chosenGroup.caution && !state.cautionConfirmed){
        const trueCat = state.chosenGroup.sourceCategory || state.chosenOption.category;
        const ok = await confirmGroupCaution(systemId, trueCat, state.chosenGroup.label);
        if(!ok){ const esc = handleBack(); if(esc) return esc; continue; }
        state.cautionConfirmed = true;
      }
      const candidateItems = wizardCandidateItems(systemId, state.chosenOption.category, state.chosenGroup, state.chosenGroup.items, implantPlatform, implantGeneration);
      const parsed = candidateItems.map(([nm,rf])=>({nm, rf, ghah: parseGHAH(nm)}));
      const allParsed = parsed.length>0 && parsed.every(p=>p.ghah);
      const uniqueGH = allParsed ? [...new Set(parsed.map(p=>p.ghah.gh))] : [];

      if(allParsed && uniqueGH.length > 1){
        state.parsedItems = parsed;
        phase = 'gh';
        continue;
      }

      const choice = await showModal({
        type:'select', progress: stepLabel, title: step.label,
        message: candidateItems.length===1
          ? `Available ${step.label.toLowerCase()}s:`
          : `${state.chosenGroup.label} — which size / gingival height do you need?`,
        options: candidateItems.map(([nm,rf],i)=>({value:i, label:nm, sublabel:'REF '+rf})),
        showBack: history.length>0 || canBackFurther
      });
      if(choice==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(choice===null) return null;
      state.chosenItem = candidateItems[choice];
      history.push('items');
      phase = 'quantity';
      continue;
    }

    // --- Gingival height (first of the two GH/AH questions) ---
    if(phase === 'gh'){
      const uniqueGH = [...new Set(state.parsedItems.map(p=>p.ghah.gh))];
      const choice = await showModal({
        type:'select', progress: stepLabel, title: step.label,
        message: `${state.chosenGroup.label} — what gingival height (GH) do you need? This is the portion that sits within the soft tissue, from the implant platform up to the gumline.`,
        options: uniqueGH.map((gh,i)=>({value:i, label:`Gingival Height: ${gh}mm`})),
        showBack: history.length>0 || canBackFurther
      });
      if(choice==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(choice===null) return null;
      state.chosenGH = uniqueGH[choice];
      history.push('gh');
      state.ghFilteredItems = state.parsedItems.filter(p=>p.ghah.gh===state.chosenGH);
      phase = 'ah';
      continue;
    }

    // --- Abutment height (second of the two GH/AH questions) ---
    if(phase === 'ah'){
      const remaining = state.ghFilteredItems;
      const onlyOne = remaining.length === 1;
      const choice = await showModal({
        type:'select', progress: stepLabel, title: step.label,
        message: onlyOne
          ? `${state.chosenGroup.label} — only one abutment height is available at ${state.chosenGH}mm gingival height, tap to confirm:`
          : `${state.chosenGroup.label} — what abutment height (AH) do you need? This is the portion above the gumline the crown or bridge attaches to. (Gingival height is set at ${state.chosenGH}mm.)`,
        options: remaining.map((p,i)=>({
          value:i, label:`Abutment Height: ${p.ghah.ah}mm`,
          sublabel: p.ghah.total ? `Total height ${p.ghah.total}mm · REF ${p.rf}` : `REF ${p.rf}`
        })),
        showBack: true
      });
      if(choice==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(choice===null) return null;
      state.chosenItem = [remaining[choice].nm, remaining[choice].rf];
      history.push('ah');
      phase = 'quantity';
      continue;
    }

    // --- Quantity ---
    if(phase === 'quantity'){
      const packSize = parsePackSize(state.chosenItem[0], state.chosenGroup.label);
      const piecesNeeded = defaultQty||1;
      const suggestedPackages = packSize>1 ? Math.max(1, Math.ceil(piecesNeeded/packSize)) : piecesNeeded;
      const packNote = packSize>1
        ? `\n\nThis item ships ${packSize} per package. You need ${piecesNeeded} piece${piecesNeeded===1?'':'s'} — enter the number of PACKAGES (suggested: ${suggestedPackages}).`
        : '';
      const qtyVal = await showModal({
        type:'prompt', progress: stepLabel, title: packSize>1 ? 'Quantity (packages)' : 'Quantity',
        message:`${friendlyItemLabel(state.chosenItem[0])}\n(${state.chosenGroup.label})\nREF ${state.chosenItem[1]}${packNote}`,
        defaultValue:String(suggestedPackages||1), okText:'Add',
        showBack: history.length>0 || canBackFurther
      });
      if(qtyVal==='__WIZARD_BACK__'){ const esc = handleBack(); if(esc) return esc; continue; }
      if(qtyVal===null) return null;
      let qty = parseInt(qtyVal,10); if(!qty||qty<1) qty=1;
      state.qty = qty; // packages actually ordered — this is what goes in the order
      state.packSize = packSize;
      break;
    }
  }

  const key = systemId+'::'+state.chosenItem[1];
  const trueCat = state.chosenGroup.sourceCategory || state.chosenOption.category;
  const existingQty = selected[key] ? selected[key].qty : 0;
  const existingTeeth = selected[key] ? selected[key].teeth : undefined;
  selected[key] = {name:state.chosenItem[0], group:state.chosenGroup.label, category:trueCat, qty: existingQty + state.qty, system:systemId, ref:state.chosenItem[1]};
  if(existingTeeth) selected[key].teeth = existingTeeth;
  trackImplantProfile(platformTracker, systemId, trueCat, state.chosenGroup.label, state.chosenItem[0]);
  render();
  renderOrder();
  await maybeOfferMultiUnitCap(systemId, trueCat, state.chosenGroup.label);
  return state.qty * (state.packSize||1); // pieces fulfilled, for the caller's remaining-quantity math
}

/* Entry point: offered right after an implant is added to the order. */
/* Snapshot/restore the order — used to cleanly undo "the previous phase"
   when Back is pressed at the start of a new one, without touching
   anything from earlier phases or added outside the wizard. */
function snapshotSelected(){
  const copy = {};
  for(const k in selected) copy[k] = {...selected[k]};
  return copy;
}
function restoreSelected(snapshot){
  selected = snapshot;
  render();
  renderOrder();
}

async function maybeRunTreatmentWizard(systemId, groupLabel, category, defaultQty, skipConfirm){
  if(WIZARD_IMPLANTS_CATEGORY_NAME[systemId] !== category) return;
  const config = WIZARD_CONFIG[systemId];
  if(!config || config.length===0) return;

  if(!skipConfirm){
    const wantsWizard = await showModal({
      type:'confirm', title:'Add parts for this implant?',
      message:'Want help selecting related parts — cover screw, healing abutment, and so on?',
      okText:'Yes, guide me', cancelText:'No, skip'
    });
    if(!wantsWizard) return;
  }

  // If this is being run standalone (from manually clicking an implant in
  // the catalog), it owns its own wizard-exit session. If it's being run
  // nested inside an already-active guided flow (the Home-screen Single/
  // Bridge wizard, one call per tooth), leave that outer session's state
  // alone — otherwise finishing this implant's parts would prematurely
  // end the X-exit session for the whole multi-tooth flow.
  const nestedInOuterWizard = wizardActive;
  if(!nestedInOuterWizard){
    wizardActive = true;
    wizardAborted = false;
    wizardExitSnapshot = snapshotSelected(); // nothing from this wizard has been added yet
  }
  try {
    const chosenSteps = await showModal({
      type:'checklist', title:'Which parts do you need?', message:'Select all that apply, then continue.',
      options: config.map((step,i)=>({value:String(i), label:step.label})), okText:'Continue'
    });
    if(!chosenSteps || chosenSteps.length===0) return;

    // Everything the wizard offers below is filtered against this implant's
    // platform (and, for zygoma, surface generation; for Neodent analogs,
    // diameter).
    const implantPlatform = implantProfileFor(systemId, category, groupLabel, '');
    const implantGeneration = null;
    let added = 0;
    const snapshots = []; // snapshot of the order right before each part started
    let n = 0;
    while(n < chosenSteps.length){
      if(wizardAborted) break;
      snapshots[n] = snapshotSelected();
      const step = config[parseInt(chosenSteps[n],10)];
      // Multi-unit Abutment gets the checklist+quantity treatment — a single
      // implant can carry several multi-unit abutments needing different
      // sizes/angulations, so letting several be picked with quantities in
      // one screen (rather than the full pick-one cascade per size) matches
      // how it's actually used. Falls back to the normal cascade if a system
      // ever defines this step with multiple subtype options.
      const useChecklistQty = step.label === 'Multi-unit Abutment' && step.options.length === 1;
      let result;
      if(useChecklistQty){
        const opt = step.options[0];
        result = await runChecklistQtyPick(systemId, opt.category, implantPlatform, implantGeneration, null, step.label, `Part ${n+1} of ${chosenSteps.length}`,
          {labelMustInclude: opt.labelMustInclude, labelMustExclude: opt.labelMustExclude, defaultQty, showBack: n>0,
           afterAdd: (groupLabel) => maybeOfferMultiUnitCap(systemId, opt.category, groupLabel)});
      } else {
        result = await runWizardStep(systemId, step, implantPlatform, defaultQty, `Part ${n+1} of ${chosenSteps.length}`, null, n>0, implantGeneration);
      }
      if(wizardAborted) break;
      if(result === '__PART_BACK__'){
        restoreSelected(snapshots[n-1]); // undo the previous part, redo it
        added = Math.max(0, added-1);
        n = n-1;
        continue;
      }
      if(result) added++;
      render();
      renderOrder();
      n++;
    }
    if(!wizardAborted && added>0) showToast(`Added ${added} related part${added===1?'':'s'}`);
  } finally {
    if(!nestedInOuterWizard){
      wizardActive = false;
      wizardExitSnapshot = null;
    }
  }
}

/* ---------- Multi-unit abutment healing cap prompt ----------
   Each system brands the cap that sits on a multi-unit-style abutment
   during healing differently — Nobel calls it a "Healing Cap" outright;
   Straumann's equivalent line is "Protective Caps"; Neodent's closest
   analog is its "Protection Cylinder". Triggers the same way the implant
   wizard does: offered right after the abutment itself is added, matched
   against the item's TRUE category (so it still fires whether the
   abutment was added from its home tab or from All-on-X Components). */
const MULTI_UNIT_CAP_TRIGGER = {
  blc: {
    category: "Screw-retained / Multi-unit Abutments",
    capLabel: "Protective Cap",
    capGroupLabel: "Protective Caps (4 pack, PEEK/TAN)"
  },
  gm: {
    category: "GM Mini Conical Abutments (Multi-unit)",
    capLabel: "Protection Cylinder",
    capGroupLabel: "GM Mini Conical Abutment — Accessories",
    capNameFilter: "Protection Cylinder"
  },
  nrcc: {
    category: "Multi-unit Abutments Plus",
    capLabel: "Healing Cap",
    capGroupLabel: "Multi-unit Accessories",
    capNameFilter: "Healing Cap"
  }
};
MULTI_UNIT_CAP_TRIGGER.nas = {
  category: "Multi-unit Abutments",
  capLabel: "Healing Cap",
  capGroupLabel: "Multi-unit Healing Cap (2/pkg) — compatible with all Multi-unit Abutments"
};
MULTI_UNIT_CAP_TRIGGER.nps = MULTI_UNIT_CAP_TRIGGER.nas;
MULTI_UNIT_CAP_TRIGGER.nrs = MULTI_UNIT_CAP_TRIGGER.nas;
MULTI_UNIT_CAP_TRIGGER.blx = MULTI_UNIT_CAP_TRIGGER.blc;
MULTI_UNIT_CAP_TRIGGER.nact = MULTI_UNIT_CAP_TRIGGER.nrcc;
MULTI_UNIT_CAP_TRIGGER.npcc = MULTI_UNIT_CAP_TRIGGER.nrcc;

/* Multi-unit temporary/pick-up copings — used for the immediate provisional
   restoration. No confirmed data for Neodent or BLT, so those are left out
   rather than guessed; the case wizard skips this step for them. */
const MULTI_UNIT_TEMP_COPING_CONFIG = {
  blc: {
    category: "Screw-retained / Multi-unit Abutments",
    label: "Temporary Coping",
    groupLabel: "Copings & Coping Auxiliaries",
    nameFilter: "Temporary Coping"
  },
  nrcc: {
    category: "Multi-unit Abutments Plus",
    label: "Temporary Coping",
    groupLabel: "Multi-unit Accessories",
    nameFilter: "Temporary"
  }
};
MULTI_UNIT_TEMP_COPING_CONFIG.blx = MULTI_UNIT_TEMP_COPING_CONFIG.blc;
MULTI_UNIT_TEMP_COPING_CONFIG.nact = MULTI_UNIT_TEMP_COPING_CONFIG.nrcc;
MULTI_UNIT_TEMP_COPING_CONFIG.npcc = MULTI_UNIT_TEMP_COPING_CONFIG.nrcc;

/* Resolves an item back to its TRUE home category, even if it was added
   from the All-on-X Components duplicate tab (which carries a different
   category string but tags the group with its real sourceCategory). */
function resolveTrueCategory(systemId, category, groupLabel){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  return (group && group.sourceCategory) || category;
}

let suppressAutoTriggers = false; // true while the All-on-X Case Wizard is running

/* ---------- Wizard exit (the "X" on wizard modals) ----------
   `wizardActive` tells showModal() whether to render the exit X at all —
   set true only while an actual wizard (per-implant or All-on-X) is
   running, so a plain manual "Quantity" prompt from browsing never gets
   one. `wizardExitSnapshot` is the order state from the moment the current
   wizard began, restored in full if the person confirms they want out —
   "lose all information" means exactly that: everything added during this
   wizard run is discarded, not just "stop asking questions." `wizardAborted`
   is checked at each step/phase loop boundary so an exit actually stops
   the whole wizard rather than just skipping to the next step (which is
   what a plain per-step cancel already does on its own). */
let wizardActive = false;
let wizardExitSnapshot = null;
let wizardAborted = false;

function cancelledValueFor(type){
  return type === 'confirm' ? false : null;
}

async function maybeOfferMultiUnitCap(systemId, category, groupLabel){
  if(suppressAutoTriggers) return; // the case wizard has its own dedicated, batch step for this
  const trigger = MULTI_UNIT_CAP_TRIGGER[systemId];
  if(!trigger) return;
  if(resolveTrueCategory(systemId, category, groupLabel) !== trigger.category) return;
  if(groupLabel === trigger.capGroupLabel) return; // the item just added IS a cap

  const wants = await showModal({
    type:'confirm', title:`Add a ${trigger.capLabel}?`,
    message:`Want to add a ${trigger.capLabel.toLowerCase()} for this multi-unit abutment?`,
    okText:'Yes, add one', cancelText:'No, skip'
  });
  if(!wants) return;

  const added = await pickFromFilteredGroup(systemId, trigger.category, trigger.capGroupLabel, trigger.capNameFilter, trigger.capLabel, 1);
  if(added) showToast(`Added ${trigger.capLabel.toLowerCase()}`);
}

/* Generic "pick one item from a specific group (optionally name-filtered),
   then quantity" flow — used by the automatic healing-cap prompt above and
   by the All-on-X case wizard below. Accumulates quantity if the exact
   same item is picked again (e.g. the same coping size for multiple
   sites), rather than overwriting the previous pick. */
async function pickFromFilteredGroup(systemId, category, groupLabel, nameFilter, promptLabel, defaultQty, progress, implantPlatform, canBackFurther){
  const sys = SYSTEMS[systemId];
  const group = (sys.catalog[category] || []).find(g=>g.label===groupLabel);
  let items = group ? group.items : [];
  if(nameFilter) items = items.filter(([nm])=>nm.includes(nameFilter));
  if(group){
    const profile = toProfile(implantPlatform, null);
    items = items.filter(([nm])=>partFits(systemId, category, group, nm, profile));
  }
  if(!group || items.length===0){
    await showModal({type:'alert', title:promptLabel, message:`No ${promptLabel.toLowerCase()} options found.`});
    return null;
  }
  if(group.caution && !(await confirmGroupCaution(systemId, group.sourceCategory || category, group.label))) return null;

  while(true){
    const choice = await showModal({
      type:'select', progress, title:promptLabel, message:'Which one?',
      options: items.map(([nm,rf],i)=>({value:i, label:nm, sublabel:'REF '+rf})),
      showBack: canBackFurther
    });
    if(choice==='__WIZARD_BACK__') return '__PART_BACK__';
    if(choice===null) return null;
    const chosenItem = items[choice];

    const packSize = parsePackSize(chosenItem[0], group.label);
    const piecesNeeded = defaultQty||1;
    const suggestedPackages = packSize>1 ? Math.max(1, Math.ceil(piecesNeeded/packSize)) : piecesNeeded;
    const packNote = packSize>1
      ? `\n\nThis item ships ${packSize} per package. You need ${piecesNeeded} piece${piecesNeeded===1?'':'s'} — enter the number of PACKAGES (suggested: ${suggestedPackages}).`
      : '';
    const qty = await showModal({
      type:'prompt', progress, title: packSize>1 ? 'Quantity (packages)' : 'Quantity', message:`${chosenItem[0]}\n(${group.label})${packNote}`,
      defaultValue:String(suggestedPackages||1), okText:'Add', showBack:true
    });
    if(qty==='__WIZARD_BACK__') continue; // re-show the item picker
    if(qty===null) return null;
    const finalQty = parseInt(qty,10) || 1; // packages actually ordered

    const key = systemId+'::'+chosenItem[1];
    const existingQty = selected[key] ? selected[key].qty : 0;
    const existingTeeth = selected[key] ? selected[key].teeth : undefined;
    selected[key] = {name:chosenItem[0], group:group.label, category, qty: existingQty + finalQty, system:systemId, ref:chosenItem[1]};
    if(existingTeeth) selected[key].teeth = existingTeeth;
    render();
    renderOrder();
    return finalQty * packSize; // pieces fulfilled, for the caller's remaining-quantity math
  }
}

/* ---------- All-on-X Case Wizard ----------
   A separate, broader wizard from the per-implant one: walks through
   everything typically needed to plan and order a full-arch, All-on-X
   case on one system — primary implants, backups, multi-unit abutments,
   temporary pick-up copings, healing caps (in case of staging/burying),
   cover screws, and a final catch-all for anything else. Available
   wherever a system has an "All-on-X Components" category (every system
   except BLT, which doesn't have a built-out multi-unit line yet). */
/* ---------- Checklist + quantity pickers ----------
   Replaces the old "ask a total, then loop pick-one/enter-quantity until
   it's covered" pattern. Instead: show every matching item as one
   checklist screen, each row with its own quantity field — check as many
   different sizes as needed and set quantities right there, submit once.
   Removes the upfront "how many total" question entirely (the total is
   just whatever ends up checked), and removes the need to re-walk the
   whole picker from scratch for a second size. */

/* Flattens every item across every group in `category` (after optional
   labelMustInclude/Exclude on the group, optional itemNameFilter on items,
   and platform/generation filtering) into one checklist_qty screen. Pass
   `groups` in opts to skip category-wide gathering and flatten a specific
   pre-chosen set of groups instead (used by the two-tier implant picker
   below, where the group is picked first to avoid an unwieldy giant list). */
async function runChecklistQtyPick(systemId, category, implantPlatform, implantGeneration, platformTracker, title, progress, opts){
  opts = opts || {};
  const sys = SYSTEMS[systemId];
  let groups = opts.groups || (sys.catalog[category] || []).slice();
  if(!opts.groups) groups = applyOptionLabelFilters(groups, opts);

  const profile = toProfile(implantPlatform, implantGeneration);
  const rows = [];
  groups.forEach(g=>{
    let items = g.items;
    if(opts.itemNameFilter) items = items.filter(([nm])=>nm.includes(opts.itemNameFilter));
    items = items.filter(([nm])=>partFits(systemId, category, g, nm, profile));
    items.forEach(([nm, rf])=>{
      const packSize = parsePackSize(nm, g.label);
      const platform = platformLabel(deriveItemPlatforms(systemId, category, g.label, nm));
      const generation = [...deriveItemGenerations(systemId, g.label, nm)].join('/');
      rows.push({
        label: friendlyItemLabel(nm),
        sublabel: (groups.length>1 ? `${g.label} · ` : '') + `REF ${rf}` + (packSize>1 ? ` · ships ${packSize}/pkg` : ''),
        group: g, name: nm, ref: rf, packSize, platform, generation
      });
    });
  });

  if(rows.length === 0){
    const plat = profile.platforms.size ? ` (${platformLabel(profile.platforms)} platform)` : '';
    await showModal({type:'alert', title, message:`None of the ${title.toLowerCase()} in this catalog fit this implant${plat}. If you need one, order it directly from the manufacturer's catalog or your rep.`});
    return null;
  }

  // Group into columns by whichever dimension actually varies among the
  // rows being shown — platform (NP/RP/WP) takes priority since it's the
  // more clinically load-bearing distinction; generation (TiUltra/TiUnite)
  // is the fallback for cases like Zygoma where both surface generations
  // can be picked together in one case. If neither varies, no grouping —
  // stays a plain flat list.
  const distinctPlatforms = new Set(rows.map(r=>r.platform).filter(Boolean));
  const sectionOf = distinctPlatforms.size > 1
    ? (r => r.platform)
    : (r => r.generation);

  let picked = await showModal({
    type:'checklist_qty', progress, title,
    message:'Check everything you need and set quantities, then continue.',
    options: rows.map((r,i)=>({value:String(i), label:r.label, sublabel:r.sublabel, defaultQty: opts.defaultQty||1, section: sectionOf(r)||undefined})),
    okText:'Add', showBack: opts.showBack
  });
  if(picked==='__WIZARD_BACK__') return '__PART_BACK__';
  if(!picked || picked.length===0) return 0;

  // Any checked row whose group carries a data caution (e.g. an unverified
  // REF) gets confirmed before it's actually added — same gate used by the
  // manual catalog and per-implant wizard, just applied per distinct group
  // here since several groups can be checked at once on this screen.
  const cautionGroupsHere = new Set(picked.map(p=>rows[parseInt(p.value,10)].group).filter(g=>g.caution));
  for(const g of cautionGroupsHere){
    const ok = await confirmGroupCaution(systemId, g.sourceCategory || category, g.label);
    if(!ok) picked = picked.filter(p=>rows[parseInt(p.value,10)].group !== g);
  }
  if(picked.length===0) return 0;

  let added = 0;
  const touchedGroups = new Set();
  picked.forEach(p=>{
    const row = rows[parseInt(p.value,10)];
    const packages = p.qty;
    const key = systemId+'::'+row.ref;
    const existingQty = selected[key] ? selected[key].qty : 0;
    const existingTeeth = selected[key] ? selected[key].teeth : undefined;
    selected[key] = {name:row.name, group:row.group.label, category, qty: existingQty + packages, system:systemId, ref:row.ref};
    if(existingTeeth) selected[key].teeth = existingTeeth;
    trackImplantProfile(platformTracker, systemId, category, row.group.label, row.name);
    touchedGroups.add(row.group.label);
    added++;
  });
  render();
  renderOrder();
  if(opts.afterAdd){
    for(const g of touchedGroups) await opts.afterAdd(g); // sequential — these can be modal-driven prompts
  }
  return added;
}

/* Two-tier picker for Primary/Backup Implants specifically — some systems
   have 80-90+ individual implant REFs across all their diameter/platform
   groups, too many for one flat checklist to be usable. First pick which
   diameter/platform group(s) apply (compact — just group labels), then
   flatten items+quantity within just those chosen groups. Backing out of
   the item/quantity screen re-shows the diameter/platform checklist to
   re-pick, rather than bubbling '__PART_BACK__' all the way out of this
   whole part — that used to silently skip the implant and let the outer
   wizard loop think this part was done. Backing out of the diameter/
   platform checklist itself (nothing to return to within this part) is
   what actually bubbles '__PART_BACK__' out to the caller. */
async function pickImplantsForCase(systemId, implantsCat, roleLabel, platformTracker, canBack, extraOpts){
  extraOpts = extraOpts || {};
  const sys = SYSTEMS[systemId];
  const allGroups = (sys.catalog[implantsCat] || []).slice();
  if(allGroups.length === 0) return 0;

  if(allGroups.length === 1){
    return await runChecklistQtyPick(systemId, implantsCat, null, null, platformTracker, roleLabel, roleLabel, {groups: allGroups, showBack: canBack, ...extraOpts});
  }

  while(true){
    const groupChoice = await showModal({
      type:'checklist', title: roleLabel, message:'Which diameter/platform variant(s) do you need?',
      options: allGroups.map((g,i)=>({value:String(i), label:g.label})), okText:'Continue', showBack: canBack
    });
    if(groupChoice==='__WIZARD_BACK__') return '__PART_BACK__';
    if(groupChoice===null) return null;
    if(!groupChoice || groupChoice.length===0) return 0;

    const chosenGroups = groupChoice.map(i=>allGroups[parseInt(i,10)]);
    const result = await runChecklistQtyPick(systemId, implantsCat, null, null, platformTracker, roleLabel, roleLabel, {groups: chosenGroups, showBack: true, ...extraOpts});
    if(result === '__PART_BACK__') continue; // re-show the diameter/platform checklist above
    return result;
  }
}

async function runAllOnXWizard(systemId){
  suppressAutoTriggers = true;
  try {
    await runAllOnXWizardInner(systemId);
  } finally {
    suppressAutoTriggers = false;
    wizardActive = false;
    wizardExitSnapshot = null;
  }
}

async function runAllOnXWizardInner(systemId){
  const sys = SYSTEMS[systemId];
  const implantsCat = WIZARD_IMPLANTS_CATEGORY_NAME[systemId];
  // Accumulates every platform (e.g. RP, WP), surface generation (zygoma)
  // and diameter actually picked across primary and backup implants, so
  // every later step only offers components that match — a single platform
  // stays locked to it; mixing platforms widens what's offered downstream
  // to match all of them. Snapshotted/restored alongside the order itself
  // so Back can cleanly undo a whole phase.
  const caseProfile = makeProfile();

  const start = await showModal({
    type:'confirm', title:'All-on-X Case Wizard',
    message:`Walk through ordering everything for a full-arch, All-on-X case on ${sys.name}: primary implants, backups, multi-unit abutments, temporary copings, healing caps, and cover screws.`,
    okText:'Start', cancelText:'Cancel'
  });
  if(!start) return;

  wizardActive = true;
  wizardAborted = false;
  wizardExitSnapshot = snapshotSelected(); // nothing from this case wizard has been added yet

  const muStep = (WIZARD_CONFIG[systemId]||[]).find(s=>s.label==='Multi-unit Abutment');
  const copingCfg = MULTI_UNIT_TEMP_COPING_CONFIG[systemId];
  const capCfg = MULTI_UNIT_CAP_TRIGGER[systemId];
  const coverStep = (WIZARD_CONFIG[systemId]||[]).find(s=>s.label==='Cover Screw');
  const extraLabels = ['Impression Coping','Analog','Implant Replica / Analog','Replacement Screw','Temporary Abutment','Impression / Analog','Healing Abutment'];
  // Copings and healing caps sit on multi-unit abutments, so those two
  // steps only make sense once the case actually has one (e.g. a 3.0
  // platform case has no multi-unit abutment that fits at all).
  const caseHasMultiUnit = () => !!muStep && Object.values(selected).some(it=>{
    if(it.system !== systemId) return false;
    const opt = muStep.options[0];
    if(resolveTrueCategory(systemId, it.category, it.group) !== opt.category) return false;
    return applyOptionLabelFilters([{label: it.group}], opt).length > 0 && !(capCfg && it.group === capCfg.capGroupLabel);
  });
  const extraOptions = (WIZARD_CONFIG[systemId]||[]).filter(s=>extraLabels.includes(s.label));

  // Each phase returns the count of items it added, or '__PART_BACK__' if
  // the person backed out of its own first gate — in which case the OUTER
  // loop below undoes the previous phase entirely and re-runs it, exactly
  // like backing out of one part in the per-implant wizard.
  const phases = [
    { // 1. Primary implants — no previous phase, so no Back offered here
      run: async () => {
        return await pickImplantsForCase(systemId, implantsCat, 'Primary Implants', caseProfile, false);
      }
    },
    { // 2. Backup implants
      run: async (canBack) => {
        const wantsBackup = await showModal({
          type:'confirm', title:'Backup Implants',
          message:"Add backup implants on hand in case a primary implant doesn't achieve good initial stability?",
          okText:'Yes', cancelText:'No, skip', showBack: canBack
        });
        if(wantsBackup==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!wantsBackup) return 0;
        return await pickImplantsForCase(systemId, implantsCat, 'Backup Implants', caseProfile, true);
      }
    },
    { // 3. Multi-unit abutments
      run: async (canBack) => {
        if(!muStep) return 0;
        const wantsMU = await showModal({type:'confirm', title:'Multi-unit Abutments', message:'Add multi-unit abutments for this case?', okText:'Yes', cancelText:'No, skip', showBack: canBack});
        if(wantsMU==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!wantsMU) return 0;
        const opt = muStep.options[0];
        return await runChecklistQtyPick(systemId, opt.category, caseProfile, null, null, 'Multi-unit Abutments', 'Multi-unit Abutments',
          {labelMustInclude: opt.labelMustInclude, labelMustExclude: opt.labelMustExclude, showBack:true});
      }
    },
    { // 4. Multi-unit temporary / pick-up copings
      run: async (canBack) => {
        if(!copingCfg || !caseHasMultiUnit()) return 0;
        const wantsCoping = await showModal({
          type:'confirm', title:'Temporary Copings',
          message:'Add pick-up/temporary copings for the multi-unit abutments, for the immediate provisional?',
          okText:'Yes', cancelText:'No, skip', showBack: canBack
        });
        if(wantsCoping==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!wantsCoping) return 0;
        return await runChecklistQtyPick(systemId, copingCfg.category, caseProfile, null, null, 'Temporary Copings', copingCfg.label,
          {labelMustInclude: copingCfg.groupLabel, itemNameFilter: copingCfg.nameFilter, showBack:true});
      }
    },
    { // 5. Healing caps
      run: async (canBack) => {
        if(!capCfg || !caseHasMultiUnit()) return 0;
        const wantsCaps = await showModal({
          type:'confirm', title:`${capCfg.capLabel}s`,
          message:`Multi-unit abutments typically need a healing cap placed over them unless you're going straight to a temporary the same visit. Add ${capCfg.capLabel.toLowerCase()}s?`,
          okText:'Yes', cancelText:'No, skip', showBack: canBack
        });
        if(wantsCaps==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!wantsCaps) return 0;
        return await runChecklistQtyPick(systemId, capCfg.category, caseProfile, null, null, `${capCfg.capLabel}s`, capCfg.capLabel,
          {labelMustInclude: capCfg.capGroupLabel, itemNameFilter: capCfg.capNameFilter, showBack:true});
      }
    },
    { // 6. Cover screws
      run: async (canBack) => {
        if(!coverStep) return 0;
        const wantsCover = await showModal({
          type:'confirm', title:'Cover Screws',
          message:'For any implants being buried instead of having a multi-unit abutment connected now (two-stage approach), add cover screws?',
          okText:'Yes', cancelText:'No, skip', showBack: canBack
        });
        if(wantsCover==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!wantsCover) return 0;
        const opt = coverStep.options[0];
        return await runChecklistQtyPick(systemId, opt.category, caseProfile, null, null, 'Cover Screws', 'Cover Screws',
          {labelMustInclude: opt.labelMustInclude, labelMustExclude: opt.labelMustExclude, showBack:true});
      }
    },
    { // 7. Anything else
      run: async (canBack) => {
        if(!extraOptions.length) return 0;
        const chosenExtras = await showModal({
          type:'checklist', title:'Anything else?',
          message:'Any other components for this case — impression copings, lab analogs, spare screws, standard healing abutments?',
          options: extraOptions.map((s,i)=>({value:String(i), label:s.label})), okText:'Continue', showBack: canBack
        });
        if(chosenExtras==='__WIZARD_BACK__') return '__PART_BACK__';
        if(!chosenExtras || chosenExtras.length===0) return 0;
        let added = 0;
        for(const idx of chosenExtras){
          const step = extraOptions[parseInt(idx,10)];
          const ok = await runWizardStep(systemId, step, caseProfile, 1, step.label);
          if(ok) added++;
        }
        return added;
      }
    }
  ];

  let addedCount = 0;
  const snapshots = []; // {selected, platforms} taken right before each phase ran
  const phaseAdds = [];
  let idx = 0;
  while(idx < phases.length){
    if(wizardAborted) break;
    snapshots[idx] = { selected: snapshotSelected(), profile: cloneProfile(caseProfile) };
    const result = await phases[idx].run(idx > 0);
    if(wizardAborted) break;
    if(result === '__PART_BACK__'){
      if(idx === 0){ continue; } // nothing before phase 0 — just retry it
      const prev = snapshots[idx-1];
      restoreSelected(prev.selected);
      const restored = prev.profile;
      ['platforms','generations','diameters'].forEach(k=>{ caseProfile[k].clear(); restored[k].forEach(x=>caseProfile[k].add(x)); });
      addedCount -= (phaseAdds[idx-1] || 0);
      phaseAdds[idx-1] = undefined;
      idx = idx - 1;
      continue;
    }
    const addedThisPhase = typeof result === 'number' ? result : 0;
    phaseAdds[idx] = addedThisPhase;
    addedCount += addedThisPhase;
    idx++;
  }

  render();
  renderOrder();
  if(!wizardAborted && addedCount>0) showToast(`All-on-X case: added ${addedCount} item${addedCount===1?'':'s'}`);
}

function findGroup(sid, category, groupLabel){
  return ((SYSTEMS[sid].catalog[category]) || []).find(g=>g.label===groupLabel) || {label: groupLabel};
}
function detectPlatformMismatches(){
  const warnings = [];
  const bySystem = {};
  Object.values(selected).forEach(it=>{ (bySystem[it.system] = bySystem[it.system] || []).push(it); });

  Object.keys(bySystem).forEach(sid=>{
    const implantsCat = PLATFORM_CHECK_CATEGORY_NAME[sid];
    if(!implantsCat) return;
    const items = bySystem[sid];

    const implants = makeProfile();
    let anyImplant = false;
    items.forEach(it=>{
      if(it.category === implantsCat){
        anyImplant = true;
        mergeProfile(implants, implantProfileFor(sid, it.category, it.group, it.name));
      }
    });
    if(!anyImplant) return; // no implants in this system's order — nothing to check against

    items.forEach(it=>{
      if(it.category === implantsCat) return;
      const group = findGroup(sid, it.category, it.group);
      if(partFits(sid, it.category, group, it.name, implants)) return;
      warnings.push({ system: sid, item: it, reason: mismatchReason(sid, it, implants) });
    });
  });
  return warnings;
}
function mismatchReason(sid, it, implants){
  const plats = deriveItemPlatforms(sid, it.category, it.group, it.name);
  if(plats.size && implants.platforms.size && ![...plats].some(x=>implants.platforms.has(x))){
    return `${platformLabel(plats)}-platform part, but this order's implants are ${platformLabel(implants.platforms)}-platform`;
  }
  const gens = deriveItemGenerations(sid, it.group, it.name);
  if(gens.size && implants.generations.size && ![...gens].some(x=>implants.generations.has(x))){
    return `${[...gens].join('/')} part, but this order's implants are ${[...implants.generations].join('/')}`;
  }
  return `sized for Ø${nameDiameters(it.name).join('/')}mm implants, but this order's implants are Ø${[...implants.diameters].join('/')}mm`;
}
function formatMismatchLine(w){
  return `${SYSTEMS[w.system].name} — "${w.item.name}" (${w.item.group}): ${w.reason}`;
}

function renderOrder(){
  const list = document.getElementById('orderList');
  const keys = Object.keys(selected);
  document.getElementById('orderCount').textContent = keys.length;

  list.innerHTML = '';

  if(currentTreatmentPlan){
    const tp = currentTreatmentPlan;
    const parts = [];
    if(tp.implants.length) parts.push(`<b>Implant:</b> #${tp.implants.join(', #')}`);
    if(tp.pontics.length) parts.push(`<b>Pontic:</b> #${tp.pontics.join(', #')}`);
    const card = document.createElement('div');
    card.className = 'treatment-plan-card';
    card.innerHTML = `<div class="tp-title"><span>${tp.type==='bridge' ? 'Bridge Treatment Plan' : 'Single Implant Crown(s) Treatment Plan'}</span>` +
      `<button class="tp-clear" onclick="clearTreatmentPlan()">Clear</button></div>${parts.join(' &nbsp;·&nbsp; ')}`;
    list.appendChild(card);
  }

  if(keys.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty-order';
    empty.innerHTML = 'No items selected yet.<br>Choose components from the catalog to build your order.';
    list.appendChild(empty);
  } else {
    const mismatches = detectPlatformMismatches();
    if(mismatches.length>0){
      const banner = document.createElement('div');
      banner.className = 'mismatch-banner';
      banner.innerHTML = `<div class="mismatch-title">⚠ Possible platform mismatch</div>` +
        `<ul>${mismatches.map(w=>`<li>${escapeHtml(formatMismatchLine(w))}</li>`).join('')}</ul>`;
      list.appendChild(banner);
    }

    keys.forEach(key=>{
      const it = selected[key];
      const packSize = parsePackSize(it.name, it.group);
      const packLine = packSize>1
        ? `<div class="rf">${it.qty} package${it.qty===1?'':'s'} × ${packSize}/pkg = ${it.qty*packSize} pieces</div>`
        : '';
      const toothTags = (it.teeth && it.teeth.length)
        ? it.teeth.map(t=>`<span class="tooth-tag">#${t}</span>`).join('')
        : '';
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = `
        <div class="info">
          <div class="nm">${describeItem(it)}${toothTags}</div>
          <div class="rf">REF ${it.ref}</div>
          ${packLine}
        </div>
        <input class="qty" type="number" min="1" value="${it.qty}" onchange="updateQty('${key}', this.value)">
        <button class="rm" title="Remove" onclick="removeItem('${key}')">✕</button>
      `;
      list.appendChild(row);
    });
  }
  updateOutput();
}

function clearTreatmentPlan(){
  currentTreatmentPlan = null;
  renderOrder();
}

/* Builds a self-contained description of an item: enough for someone to
   order it correctly even if they never look up the REF number. Always
   names the implant system so mixed multi-brand orders stay unambiguous. */
function describeItem(it){
  const sys = SYSTEMS[it.system];
  const prefix = sys.prefix[it.category];
  if(prefix){
    return `${prefix}, ${it.group}, ${it.name} length`;
  }
  if(prefix === ''){
    return `${sys.name} — ${it.group}, ${it.name}`;
  }
  return `${sys.name} — ${it.category}: ${it.group}, ${it.name}`;
}

function updateOutput(){
  const keys = Object.keys(selected);
  const ta = document.getElementById('outputText');
  if(keys.length===0){
    ta.value = "No items selected.";
    return;
  }
  const today = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const bySystem = {};
  keys.forEach(key=>{
    const it = selected[key];
    (bySystem[it.system] = bySystem[it.system] || []).push(it);
  });
  const systemsUsed = Object.keys(bySystem);

  let lines = [];
  lines.push(systemsUsed.length>1 ? 'Multi-System Implant Order Request' : `${SYSTEMS[systemsUsed[0]].name} Order Request`);
  lines.push(`Date: ${today}`);
  lines.push('');

  let counter = 0;
  SYSTEM_IDS.forEach(sid=>{
    const items = bySystem[sid];
    if(!items || items.length===0) return;
    if(systemsUsed.length>1){
      lines.push(`── ${SYSTEMS[sid].name} ──`);
      lines.push('');
    }
    items.forEach(it=>{
      counter++;
      lines.push(`${counter}. ${describeItem(it)}`);
      lines.push(`    REF ${it.ref}  ·  Qty: ${it.qty}`);
      lines.push('');
    });
  });
  lines.push(`Total line items: ${keys.length}`);
  ta.value = lines.join('\n');
}

async function copyText(){
  const mismatches = detectPlatformMismatches();
  if(mismatches.length>0){
    const msg = "Possible platform mismatch detected:\n\n" +
      mismatches.map(w=>"• " + formatMismatchLine(w)).join("\n") +
      "\n\nThis can be intentional (e.g. different sites needing different platforms) — just double-check before ordering.";
    const ok = await showModal({type:'confirm', title:'⚠ Check before copying', message:msg, okText:'Copy anyway', cancelText:'Go back'});
    if(!ok) return;
  }
  const ta = document.getElementById('outputText');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    showToast('Order copied to clipboard');
  }).catch(()=>{
    document.execCommand('copy');
    showToast('Order copied to clipboard');
  });
}

/* Custom in-app modal — replaces window.prompt/confirm/alert, which many
   sandboxed mobile webviews (including how artifacts render in the Claude
   mobile app) silently block or no-op. Returns a Promise: prompt resolves
   with the entered string (or null if cancelled), confirm resolves with
   true/false, alert resolves with true once dismissed. */
function showModal(opts){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box' + (opts.type==='checklist' || opts.type==='select' || opts.type==='checklist_qty' || opts.type==='odontogram' ? ' modal-wide' : '');

    if(opts.progress){
      const prog = document.createElement('div');
      prog.className = 'wizard-progress';
      prog.textContent = opts.progress;
      box.appendChild(prog);
    }
    if(opts.title){
      const h3 = document.createElement('h3');
      h3.textContent = opts.title;
      box.appendChild(h3);
    }
    if(opts.message){
      const p = document.createElement('p');
      p.textContent = opts.message;
      box.appendChild(p);
    }

    function close(result){
      document.body.removeChild(overlay);
      resolve(result);
    }

    if(wizardActive && opts.type !== 'alert'){
      const xBtn = document.createElement('button');
      xBtn.className = 'modal-exit-x';
      xBtn.innerHTML = '✕';
      xBtn.title = 'Exit wizard';
      xBtn.onclick = async ()=>{
        const confirmed = await showModal({
          type:'confirm', title:'Exit wizard?',
          message:"Everything added during this wizard will be removed — nothing you added before starting it will be affected. This can't be undone.",
          okText:'Exit & discard', cancelText:'Keep going'
        });
        if(!confirmed) return; // stay on the current modal, untouched
        if(wizardExitSnapshot){ restoreSelected(wizardExitSnapshot); render(); renderOrder(); }
        wizardAborted = true;
        close(cancelledValueFor(opts.type));
      };
      box.appendChild(xBtn);
    }

    let input = null;
    const checkboxes = [];

    if(opts.type === 'prompt'){
      input = document.createElement('input');
      input.type = 'number';
      input.min = '1';
      input.value = opts.defaultValue || '1';
      box.appendChild(input);
    }

    if(opts.type === 'checklist'){
      const optWrap = document.createElement('div');
      optWrap.className = 'modal-options';
      opts.options.forEach(o=>{
        const row = document.createElement('label');
        row.className = 'modal-check-row';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = o.value;
        checkboxes.push(cb);
        row.appendChild(cb);
        const span = document.createElement('span');
        span.textContent = o.label;
        row.appendChild(span);
        optWrap.appendChild(row);
      });
      box.appendChild(optWrap);
    }

    // checklist_qty: a scrollable list of checkbox rows, each with its own
    // inline quantity field. Lets a person pick several different sizes at
    // once — e.g. one 3.5mm and one 4.3mm backup implant — and set each
    // one's quantity right there, instead of looping through a full
    // pick-one/enter-quantity cascade per size. The quantity field is
    // disabled until its row is checked, and checking a row focuses its
    // quantity field for a fast type-and-tab flow. When options carry a
    // `section` (e.g. platform — NP vs RP), rows are grouped into
    // side-by-side columns per section instead of one mixed list, so
    // picking backups across two platforms doesn't read as one
    // undifferentiated wall of rows.
    const checkQtyRows = [];
    if(opts.type === 'checklist_qty'){
      const buildRow = (o) => {
        const row = document.createElement('div');
        row.className = 'modal-checkqty-row';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = o.value;
        const info = document.createElement('label');
        info.className = 'cq-info';
        info.innerHTML = `<span class="cq-label">${o.label}</span>` + (o.sublabel ? `<span class="cq-sub">${o.sublabel}</span>` : '');
        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '1';
        qtyInput.className = 'cq-qty';
        qtyInput.value = String(o.defaultQty || 1);
        qtyInput.disabled = true;
        cb.addEventListener('change', ()=>{
          qtyInput.disabled = !cb.checked;
          if(cb.checked) qtyInput.focus();
        });
        info.addEventListener('click', (e)=>{ e.preventDefault(); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); });
        row.appendChild(cb);
        row.appendChild(info);
        row.appendChild(qtyInput);
        checkQtyRows.push({cb, qtyInput, value:o.value, packSize:o.packSize||1});
        return row;
      };

      const sections = [...new Set(opts.options.map(o=>o.section).filter(Boolean))];
      if(sections.length > 1){
        box.classList.add('modal-grouped');
        const grid = document.createElement('div');
        grid.className = 'modal-checkqty-sections';
        sections.forEach(sec=>{
          const col = document.createElement('div');
          col.className = 'modal-checkqty-section';
          const head = document.createElement('div');
          head.className = 'modal-checkqty-section-head';
          head.textContent = sec;
          col.appendChild(head);
          opts.options.filter(o=>o.section===sec).forEach(o=> col.appendChild(buildRow(o)));
          grid.appendChild(col);
        });
        const unsectioned = opts.options.filter(o=>!o.section);
        if(unsectioned.length){
          const col = document.createElement('div');
          col.className = 'modal-checkqty-section';
          const head = document.createElement('div');
          head.className = 'modal-checkqty-section-head';
          head.textContent = 'Other';
          col.appendChild(head);
          unsectioned.forEach(o=> col.appendChild(buildRow(o)));
          grid.appendChild(col);
        }
        box.appendChild(grid);
      } else {
        const optWrap = document.createElement('div');
        optWrap.className = 'modal-options';
        opts.options.forEach(o=> optWrap.appendChild(buildRow(o)));
        box.appendChild(optWrap);
      }
    }

    // odontogram: an interactive Universal Numbering (1-32) tooth chart.
    // Tapping a tooth cycles none → implant → (pontic, bridge mode only) →
    // none. Single-tooth mode allows exactly one implant tooth and no
    // pontics at all; bridge mode allows multiple of each. Resolves with
    // {implants:[...], pontics:[...]}, both sorted ascending.
    let odoState = {};
    let odoSummaryEl = null;
    if(opts.type === 'odontogram'){
      box.classList.add('modal-grouped');
      const wrap = document.createElement('div');
      wrap.className = 'odo-wrap';

      const legend = document.createElement('div');
      legend.className = 'odo-legend';
      legend.innerHTML = `<span><span class="odo-swatch" style="background:var(--green)"></span>Implant</span>` +
        (opts.mode==='bridge' ? `<span><span class="odo-swatch" style="background:#F3D48A"></span>Pontic (no implant)</span>` : '');
      wrap.appendChild(legend);

      const upperLabel = document.createElement('div');
      upperLabel.className = 'odo-arch-label'; upperLabel.textContent = 'Upper';
      wrap.appendChild(upperLabel);
      const upperRow = document.createElement('div');
      upperRow.className = 'odo-arch upper';
      const lowerRow = document.createElement('div');
      lowerRow.className = 'odo-arch lower';

      odoSummaryEl = document.createElement('div');
      odoSummaryEl.className = 'odo-summary';

      const updateSummary = () => {
        const implants = Object.keys(odoState).filter(t=>odoState[t]==='implant').map(Number).sort((a,b)=>a-b);
        const pontics = Object.keys(odoState).filter(t=>odoState[t]==='pontic').map(Number).sort((a,b)=>a-b);
        if(implants.length===0 && pontics.length===0){
          odoSummaryEl.innerHTML = 'Tap a tooth to mark it.';
        } else {
          let html = '';
          if(implants.length) html += `<b>Implant:</b> #${implants.join(', #')}`;
          if(pontics.length) html += (html?' &nbsp;·&nbsp; ':'') + `<b>Pontic:</b> #${pontics.join(', #')}`;
          odoSummaryEl.innerHTML = html;
        }
      };

      const makeTooth = (num) => {
        const t = document.createElement('div');
        t.className = 'odo-tooth';
        t.textContent = num;
        t.dataset.tooth = num;
        t.onclick = ()=>{
          const cur = odoState[num] || 'none';
          if(cur === 'none'){
            odoState[num] = 'implant';
          } else if(cur === 'implant'){
            if(opts.mode === 'bridge') odoState[num] = 'pontic'; // bridge sites can be a pontic instead
            else delete odoState[num]; // single-implant mode: tap again to clear, no pontic concept
          } else {
            delete odoState[num]; // pontic → clear
          }
          wrap.querySelectorAll('.odo-tooth').forEach(el=>{
            const n = el.dataset.tooth;
            el.classList.remove('implant','pontic');
            if(odoState[n]) el.classList.add(odoState[n]);
          });
          updateSummary();
        };
        return t;
      };

      for(let n=1; n<=16; n++) upperRow.appendChild(makeTooth(n));
      for(let n=32; n>=17; n--) lowerRow.appendChild(makeTooth(n));

      wrap.appendChild(upperRow);
      const lowerLabel = document.createElement('div');
      lowerLabel.className = 'odo-arch-label'; lowerLabel.textContent = 'Lower';
      wrap.appendChild(lowerRow);
      wrap.appendChild(lowerLabel);
      wrap.appendChild(odoSummaryEl);
      updateSummary();
      box.appendChild(wrap);
    }

    if(opts.type === 'select'){
      const optWrap = document.createElement('div');
      optWrap.className = 'modal-options';
      opts.options.forEach(o=>{
        const btn = document.createElement('button');
        btn.className = 'modal-select-row';
        btn.innerHTML = `<span class="msr-label">${o.label}</span>` + (o.sublabel ? `<span class="msr-sub">${o.sublabel}</span>` : '');
        btn.onclick = ()=> close(o.value);
        optWrap.appendChild(btn);
      });
      box.appendChild(optWrap);
    }

    const actions = document.createElement('div');
    actions.className = 'modal-actions';

    if(opts.showBack){
      const backBtn = document.createElement('button');
      backBtn.className = 'modal-btn-cancel modal-btn-back';
      backBtn.textContent = '← Back';
      backBtn.onclick = ()=> close('__WIZARD_BACK__');
      actions.appendChild(backBtn);
    }

    if(opts.type !== 'alert' && opts.type !== 'select'){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn-cancel';
      cancelBtn.textContent = opts.cancelText || 'Cancel';
      cancelBtn.onclick = ()=> close((opts.type==='prompt' || opts.type==='checklist' || opts.type==='checklist_qty' || opts.type==='odontogram') ? null : false);
      actions.appendChild(cancelBtn);
    } else if(opts.type === 'select'){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn-cancel';
      cancelBtn.textContent = opts.cancelText || 'Cancel';
      cancelBtn.onclick = ()=> close(null);
      actions.appendChild(cancelBtn);
    }

    if(opts.type !== 'select'){
      const okBtn = document.createElement('button');
      okBtn.className = 'modal-btn-ok';
      okBtn.textContent = opts.okText || 'OK';
      okBtn.onclick = ()=>{
        if(opts.type==='prompt') close(input.value || opts.defaultValue || '1');
        else if(opts.type==='checklist') close(checkboxes.filter(c=>c.checked).map(c=>c.value));
        else if(opts.type==='checklist_qty'){
          const picked = checkQtyRows
            .filter(r=>r.cb.checked)
            .map(r=>({value:r.value, qty: parseInt(r.qtyInput.value,10) || 1}));
          close(picked);
        }
        else if(opts.type==='odontogram'){
          const implants = Object.keys(odoState).filter(t=>odoState[t]==='implant').map(Number).sort((a,b)=>a-b);
          const pontics = Object.keys(odoState).filter(t=>odoState[t]==='pontic').map(Number).sort((a,b)=>a-b);
          if(implants.length===0){
            odoSummaryEl.innerHTML = '<span style="color:#B23">Mark at least one implant tooth to continue.</span>';
            return;
          }
          close({implants, pontics});
        }
        else close(true);
      };
      actions.appendChild(okBtn);
    }

    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    if(input){
      input.focus();
      input.select();
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') close(input.value || '1'); });
    } else if(opts.type !== 'select' && opts.type !== 'checklist'){
      const okBtn = box.querySelector('.modal-btn-ok');
      if(okBtn) okBtn.focus();
    }
    overlay.addEventListener('click', e=>{
      if(e.target!==overlay) return;
      if(opts.type==='prompt' || opts.type==='select') close(null);
      else if(opts.type==='checklist' || opts.type==='checklist_qty') close(null);
      else close(false);
    });
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ---------- Search wiring ---------- */
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('homeBtn').addEventListener('click', ()=> navigateWithFade(()=>{ viewMode='home'; render(); }));

/* ---------- Init ---------- */
render();
renderOrder();
</script>
