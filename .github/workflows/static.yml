# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The catalog and compatibility tests must pass before anything deploys.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Stamp each script URL with this commit so phones never mix a fresh
      # index.html with a cached older .js file (Pages caches for 10 min).
      - name: Cache-bust script URLs
        run: sed -i -E "s#<script src=\"([^\"?]+\.js)\"></script>#<script src=\"\1?v=${GITHUB_SHA::8}\"></script>#" index.html && grep -n '<script src=' index.html
      # A new offline cache for each deploy, so phones drop the old copy.
      - name: Stamp the offline cache name
        run: sed -i "s/implant-selector-dev/implant-selector-${GITHUB_SHA::8}/" sw.js && grep -n "const CACHE" sw.js | grep -q "${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
